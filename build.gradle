    group = 'application'
    description = 'Copy current READY content translations into the exact shared cache'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tripborabackfill.SharedTranslationCacheBackfillApplication'
}
