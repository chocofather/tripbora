plugins {
    id 'java'
    // 3.4.x 는 지원이 끝났다. Java 17 을 그대로 쓰는 3.5 지원 라인의 최신 패치를 쓴다.
    // Spring Framework/Security/Tomcat 등 Boot 가 관리하는 버전은 이 BOM 에 맡긴다.
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tripbora'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

springBoot {
    mainClass = 'com.tripbora.TripBoraApplication'
}

/*
  Boot BOM 이 정한 버전을 그대로 쓰되, BOM 판보다 뒤에 나온 보안 수정이 있는 것만 끌어올린다.
  Boot 가 다음 패치에서 같은 버전 이상을 가리키면 이 줄은 지워도 된다.

  - tomcat 10.1.55 : 인증/권한 우회 계열 CRITICAL 3건(CVE-2026-65905 / 65182 / 68525)이
                     10.1.58 에서 고쳐졌다. 10.1.58 은 배포되지 않아 그다음 판을 쓴다.
                     (Jakarta EE 10 / Java 17 기준은 그대로다)
  - jackson  2.21.4 : 역직렬화 애노테이션 우회 3건이 2.21.5 에서 고쳐졌다.
*/
ext['tomcat.version'] = '10.1.60'
ext['jackson-bom.version'] = '2.21.6'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // Srping Boot 기본 라이브러리
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Lombok (자동 코드 생성)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MyBatis + MySQL
    // Connector/J 버전은 Boot BOM 이 관리한다. (직접 고정하지 않는다)
    implementation 'com.mysql:mysql-connector-j'
    // MyBatis starter 는 Boot BOM 이 관리하지 않아 직접 고정한다.
    // 3.0.5 는 Spring Boot 3.5 기준으로 만들어진 판이다.
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'

    // DB migration (Flyway). 버전은 Boot BOM 이 관리한다.
    // Flyway 10 부터 MySQL 지원이 flyway-core 밖의 flyway-mysql 모듈로 나뉘어 둘 다 필요하다.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // DevTools (자동 리로드)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // 게시글 에디터 HTML 정화. Boot BOM 이 관리하지 않아 직접 고정한다.
    // 사용자 HTML 을 실제로 걸러 내는 자리라 보안 수정을 따라가려고 최신 판을 쓴다.
    implementation 'org.jsoup:jsoup:1.23.2'

    // 사용자 콘텐츠 언어 감지 및 Google Cloud Translation v3
    implementation 'com.github.pemistahl:lingua:1.2.2'
    implementation platform('com.google.cloud:libraries-bom:26.88.1')
    implementation 'com.google.cloud:google-cloud-translate'

    // 메일 전송
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 테스트 관련
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 페이징
    implementation 'com.github.pagehelper:pagehelper-spring-boot-starter:1.4.6'

    // 공동 여행계획 실시간 접속 표시 (WebSocket + STOMP)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // 브라우저 STOMP 클라이언트. CDN 대신 WebJar 로 함께 배포한다
    implementation 'org.webjars.npm:stomp__stompjs:7.0.0'

    // 다이어리 PDF Phase 1: 현재 페이지 DOM 캡처와 브라우저 PDF 생성
    implementation 'org.webjars.npm:html-to-image:1.11.13'
    implementation 'org.webjars.npm:jspdf:3.0.1'

}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('backfillDestinationCommentLanguages', JavaExec) {
    group = 'application'
    description = 'Classify und destination comment source languages with the local detector'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tripborabackfill.DestinationCommentLanguageBackfillApplication'
}

tasks.register('backfillPostCommentLanguages', JavaExec) {
    group = 'application'
    description = 'Classify und post comment source languages with the local detector'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.tripborabackfill.PostCommentLanguageBackfillApplication'
}

