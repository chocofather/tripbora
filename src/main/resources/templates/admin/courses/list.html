<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'courses')}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/course-themes.css">
  <link rel="stylesheet" href="/css/admin-courses.css">
</th:block>
<th:block th:fragment="body">
  <section class="admin-page-section admin-courses-page">
    <header class="admin-page-header">
      <div class="admin-page-heading">
        <h1 class="admin-page-title">검증 코스 관리</h1>
        <p class="admin-page-description">TripBora가 확인한 여행코스를 조회하고 공개 상태를 관리합니다.</p>
      </div>
      <div class="admin-page-actions"><a th:href="@{/admin/courses/new}" class="admin-btn is-primary">+ 검증 코스 등록</a></div>
    </header>

    <div class="admin-filter-card">
      <form th:action="@{/admin/courses}" method="get" class="admin-filter-form">
        <label class="admin-filter-field admin-course-keyword"><span>제목</span>
          <input type="search" name="keyword" class="admin-input" maxlength="255" th:value="${keyword}" placeholder="코스 제목 검색">
        </label>
        <label class="admin-filter-field"><span>상태</span>
          <select name="status" class="admin-select">
            <option value="">전체</option>
            <option value="DRAFT" th:selected="${status == 'DRAFT'}">임시저장</option>
            <option value="PUBLISHED" th:selected="${status == 'PUBLISHED'}">공개</option>
            <option value="HIDDEN" th:selected="${status == 'HIDDEN'}">숨김</option>
          </select>
        </label>
        <div class="admin-filter-actions">
          <button type="submit" class="admin-btn is-primary">조회</button>
          <a th:href="@{/admin/courses}" class="admin-btn">초기화</a>
        </div>
      </form>
    </div>
    <p class="admin-course-total" th:text="|총 ${totalCount}개|">총 0개</p>
    <div class="admin-card is-table-card">
      <div class="admin-table-wrapper">
        <table class="admin-table admin-course-table">
          <thead><tr><th>코스</th><th>국가</th><th>일수</th><th>상태</th><th>작성일</th><th>관리</th></tr></thead>
          <tbody>
          <tr th:each="course : ${courses}">
            <td data-label="코스">
              <div class="admin-course-list-title">
                <img class="admin-course-thumbnail" th:src="${course.representativeImageUrl ?: '/images/default.png'}" alt="" loading="lazy">
                <div>
                  <a th:href="@{/admin/courses/{id}/edit(id=${course.id})}" th:text="${course.title}">코스 제목</a>
                  <div th:replace="~{course/fragments/themes :: badges(${course.themes}, true)}"></div>
                </div>
              </div>
            </td>
            <td data-label="국가" th:text="${#strings.listJoin(course.countryNames, ' · ')}">대한민국</td>
            <td data-label="일수" th:text="|${course.dayCount}일|">1일</td>
            <td data-label="상태"><span class="admin-course-status" th:text="${course.status == 'PUBLISHED' ? '공개' : (course.status == 'HIDDEN' ? '숨김' : '임시저장')}">임시저장</span></td>
            <td data-label="작성일" th:text="${#dates.format(course.createdAt, 'yyyy-MM-dd')}">2026-10-17</td>
            <td data-label="관리"><div class="admin-action-group">
              <a th:href="@{/admin/courses/{id}/edit(id=${course.id})}" class="admin-btn is-small">수정</a>
              <a th:href="@{/admin/courses/{id}/preview(id=${course.id})}" class="admin-btn is-small">미리보기</a>
            </div></td>
          </tr>
          <tr th:if="${#lists.isEmpty(courses)}"><td colspan="6" class="admin-table-empty">조건에 맞는 검증 코스가 없습니다.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <nav class="admin-course-pagination" aria-label="검증 코스 페이지" th:if="${totalPages > 0}">
      <a class="admin-btn" th:if="${currentPage > 1}" th:href="@{/admin/courses(page=${currentPage - 1},keyword=${keyword},status=${status})}">이전</a>
      <span th:text="|${currentPage} / ${totalPages}|">1 / 1</span>
      <a class="admin-btn" th:if="${currentPage < totalPages}" th:href="@{/admin/courses(page=${currentPage + 1},keyword=${keyword},status=${status})}">다음</a>
    </nav>
  </section>
</th:block>
</html>
