<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::body}, ~{::headFragment}, 'destinations')}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" th:href="@{/css/admin-compact-lists.css}">
  <script th:src="@{/js/admin-destination-filter.js}" defer></script>
  <script th:src="@{/js/admin-destination-bulk-delete.js}" defer></script>
  <script th:src="@{/js/admin-destination-visibility.js}" defer></script>
  <script th:src="@{/js/admin-destination-actions.js}" defer></script>
</th:block>
<th:block th:fragment="body">
  <section class="admin-page-section">
    <header class="admin-page-header">
      <div class="admin-page-heading">
        <h1 class="admin-page-title">여행지 관리</h1>
        <p class="admin-page-description">전체 여행지를 조회하고 관리합니다.</p>
      </div>
      <div class="admin-page-actions">
        <!-- 등록 방법 네 가지. 크기·모양을 같게 두고 순서로만 구분한다. -->
        <a th:href="@{/admin/destinations/json-import}" class="admin-btn">JSON 일괄 등록</a>
        <a th:href="@{/admin/destinations/wikidata-import}" class="admin-btn">해외 일괄 등록</a>
        <a th:href="@{/admin/destinations/kto-import}" class="admin-btn">국내 일괄 등록</a>
        <a th:href="@{/admin/destinations/create}" class="admin-btn">직접 등록</a>
      </div>
    </header>

    <div th:if="${error}" class="admin-alert" role="alert" th:text="${error}"></div>
    <div th:if="${bulkDeleteResult}" class="admin-alert" role="status" th:text="${bulkDeleteResult}"></div>
    <div class="admin-alert" role="alert" data-destination-visibility-error hidden></div>

    <div class="admin-filter-card is-toolbar">
      <form id="admin-destination-filter-form" method="get"
            th:action="@{/admin/destinations}" class="admin-filter-form">
        <input id="destination-keyword-filter" type="search" name="keyword"
               class="admin-input admin-filter-search"
               placeholder="여행지명 검색 (초성 검색 가능: ㄱㅂㄱ)" aria-label="여행지명 검색"
               autocomplete="off" th:value="${keyword}"/>

        <!-- 범위 탭은 누르는 즉시 GET 으로 다시 조회한다(scope). 검색어·분류·정렬은 그대로 두고 지역 조건만 비운다. -->
        <div class="admin-filter-tabs" aria-label="여행지 범위 필터">
          <button type="submit" value="all"
                  class="admin-filter-tab"
                  onclick="this.form.scope.value=''"
                  th:classappend="${type} == null or ${type} == 'all' ? ' active' : ''">전체</button>
          <button type="submit" value="domestic"
                  class="admin-filter-tab"
                  onclick="this.form.scope.value='domestic'"
                  th:classappend="${type} == 'domestic' ? ' active' : ''">국내</button>
          <button type="submit" value="overseas"
                  class="admin-filter-tab"
                  onclick="this.form.scope.value='overseas'"
                  th:classappend="${type} == 'overseas' ? ' active' : ''">해외</button>
          <input id="destination-filter-type" type="hidden" name="scope" th:value="${type}" />
        </div>

        <!-- 분류(destinations.type)와 정렬은 바꾸는 즉시 조회한다. -->
        <select id="destination-type-filter" name="destinationType" class="admin-select" aria-label="분류">
          <option value="">분류 전체</option>
          <option th:each="entry : ${destinationTypeLabels}" th:value="${entry.key}" th:text="${entry.value}"
                  th:selected="${destinationType} == ${entry.key}">관광지</option>
        </select>

        <select id="destination-visibility-filter" name="visibility" class="admin-select" aria-label="공개 상태"
                th:attr="data-implicit-visibility=${visibility == null}">
          <option value="all" th:selected="${visibility == null or visibility == 'all'}">전체</option>
          <option value="public" th:selected="${visibility == 'public'}">공개</option>
          <option value="hidden" th:selected="${visibility == 'hidden'}">숨김</option>
        </select>

        <!-- 데이터 상태(누락 항목)도 바꾸는 즉시 조회한다. 판정은 DB 조회 단계에서 한다. -->
        <select id="destination-data-status-filter" name="dataStatus" class="admin-select" aria-label="데이터 상태">
          <option value="">데이터 상태 전체</option>
          <option th:each="entry : ${dataStatusLabels}" th:value="${entry.key}" th:text="${entry.value}"
                  th:selected="${dataStatus} == ${entry.key}">이미지 없음</option>
        </select>

        <select id="destination-continent-filter" name="continentId" class="admin-select"
                th:if="${type} == 'overseas'">
          <option value="">- 대륙 선택 -</option>
          <option th:each="c : ${continents}" th:value="${c.id}" th:text="${c.regionName}"
                  th:selected="${continentId} == ${c.id}"></option>
        </select>
        <select id="destination-country-filter" name="countryId" class="admin-select"
                th:if="${type} == 'overseas'" th:disabled="${continentId == null}">
          <option value="">- 국가 선택 -</option>
          <option th:each="c : ${countries}" th:value="${c.id}" th:text="${c.regionName}"
                  th:selected="${countryId} == ${c.id}"></option>
        </select>
        <select id="destination-city-filter" name="cityId" class="admin-select"
                th:if="${type} == 'overseas'" th:disabled="${countryId == null}">
          <option value="">- 도시 선택 -</option>
          <option th:each="c : ${cities}" th:value="${c.id}" th:text="${c.regionName}"
                  th:selected="${cityId} == ${c.id}"></option>
        </select>

        <select id="destination-region-filter" name="regionId" class="admin-select"
                th:if="${type} == 'domestic'">
          <option value="">- 시/도 선택 -</option>
          <option th:each="r : ${regions}" th:value="${r.id}" th:text="${r.regionName}"
                  th:selected="${regionId} == ${r.id}"></option>
        </select>
        <select id="destination-district-filter" name="districtId" class="admin-select"
                th:if="${type} == 'domestic'" th:disabled="${regionId == null}">
          <option value="">- 시/군/구 선택 -</option>
          <option th:each="d : ${districts}" th:value="${d.id}" th:text="${d.regionName}"
                  th:selected="${districtId} == ${d.id}"></option>
        </select>

        <select id="destination-sort-filter" name="sort" class="admin-select" aria-label="정렬">
          <option th:each="entry : ${sortLabels}" th:value="${entry.key}" th:text="${entry.value}"
                  th:selected="${sort} == ${entry.key}">최신 등록순</option>
        </select>

        <div class="admin-filter-actions">
          <a th:href="@{/admin/destinations}" class="admin-btn is-small">초기화</a>
        </div>
      </form>
    </div>

    <!-- 데이터 상태 바로가기. 건수는 데이터 상태만 뺀 지금 조건 기준이고, 누르면 그 상태로 1쪽부터 본다. -->
    <nav class="admin-data-status-bar" aria-label="데이터 상태 바로가기">
      <a th:each="shortcut : ${statusShortcuts}"
         th:with="active=${shortcut.status() == 'hidden' ? visibility == 'hidden' : (shortcut.status() == null ? dataStatus == null : shortcut.status() == dataStatus)}"
         th:href="${shortcut.url()}" class="admin-data-status-link"
         th:classappend="${active ? 'is-active' : ''} + ${shortcut.status() != null and shortcut.count() > 0 ? ' has-issue' : ''}"
         th:attr="aria-current=${active} ? 'true' : null">
        <span th:text="${shortcut.label()}">이미지 없음</span>
        <strong th:text="${#numbers.formatInteger(shortcut.count(), 1, 'COMMA')}">0</strong>
      </a>
    </nav>

    <!--
      선택 삭제. 행 체크박스가 form 속성으로 이 폼에 묶여 있어 체크한 여행지 ID만 destinationIds 로 한 번에 보낸다.
      선택은 지금 쪽에 보이는 행만 대상이다(쪽을 넘기면 선택이 이어지지 않는다).
      삭제 후에도 지금 목록 조건(쪽 포함)으로 돌아오도록 조건을 주소에 함께 보낸다.
    -->
    <div class="admin-list-toolbar">
      <p class="admin-list-summary" th:text="|총 ${#numbers.formatInteger(totalCount, 1, 'COMMA')}곳|">총 0곳</p>
      <form th:unless="${#lists.isEmpty(destinationList)}" id="destination-bulk-delete-form"
            th:action="@{'/admin/destinations/bulk-delete' + ${listQuery}}"
            method="post" class="admin-destination-bulk-delete" data-destination-bulk-delete>
        <span class="admin-destination-selection-count" aria-live="polite"
              data-destination-selection-count>이 페이지에서 선택 없음</span>
        <button type="submit" class="admin-btn is-small is-danger"
                data-destination-bulk-delete-submit disabled>선택 삭제</button>
      </form>
    </div>

    <div class="admin-card is-table-card">
      <div class="admin-table-wrapper">
        <table class="admin-table admin-destination-table">
          <thead>
          <tr>
            <th class="admin-table-select">
              <input type="checkbox" th:unless="${#lists.isEmpty(destinationList)}"
                     aria-label="현재 페이지 여행지 전체 선택" title="현재 페이지 전체 선택"
                     data-destination-select-all>
            </th>
            <th>#</th>
            <th>여행지명</th>
            <th>지역</th>
            <th>관리</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${#lists.isEmpty(destinationList)}">
            <td colspan="5" class="admin-table-empty">조건에 맞는 여행지가 없습니다.</td>
          </tr>
          <!-- 번호는 DB ID 가 아니라 지금 조건·정렬에서의 순번이다(쪽을 넘겨도 이어진다). -->
          <tr th:each="dest, stat : ${destinationList}">
            <td class="admin-table-select">
              <input type="checkbox" name="destinationIds" form="destination-bulk-delete-form"
                     th:value="${dest.id}" th:attr="aria-label=|${dest.name} 선택|"
                     data-destination-select>
            </td>
            <td class="admin-table-number" th:text="${pageOffset + stat.index + 1}">1</td>
            <td>
              <span th:text="${dest.name}">제주도</span>
              <span class="admin-destination-visibility-badge"
                    th:classappend="${dest.publicVisible} ? 'is-public' : 'is-hidden'"
                    th:text="${dest.publicVisible} ? '공개' : '숨김'">공개</span>
              <!-- 누락 항목이 있을 때만 작게 표시한다(정상 여행지에는 붙이지 않는다). -->
              <div class="admin-data-issues" th:if="${dest.hasDataIssue()}">
                <span class="admin-data-issue" th:if="${dest.missingImage}">이미지 없음</span>
                <span class="admin-data-issue" th:if="${dest.missingMainImage}"
                      title="이미지는 있지만 대표 이미지가 지정되지 않았습니다.">대표 이미지 없음</span>
                <span class="admin-data-issue" th:if="${dest.missingCategory}">카테고리 없음</span>
                <span class="admin-data-issue" th:if="${dest.missingDescription}"
                      title="한국어 간단 설명과 상세 설명이 모두 비어 있습니다.">기본 설명 없음</span>
                <span class="admin-data-issue" th:if="${dest.missingTranslation}"
                      th:with="missingLanguages=${#strings.listJoin(dest.missingTranslationLanguages, ', ')}"
                      th:title="|번역이 완료되지 않은 언어: ${missingLanguages} (이름 또는 한국어에 있는 설명이 비어 있음)|"
                      th:text="${#lists.size(dest.missingTranslationLanguages) == 4} ? '번역 없음' : |번역 누락: ${missingLanguages}|">번역 누락: ja</span>
              </div>
            </td>
            <td th:text="${dest.regionName}">제주</td>
            <td class="admin-table-actions">
              <div class="admin-action-group">
                <a th:href="@{'/admin/destinations/' + ${dest.id} + '/images'}"
                   class="admin-btn is-small">이미지 관리</a>
                <a th:href="@{'/admin/destinations/edit/' + ${dest.id}}"
                   class="admin-btn is-small">수정</a>
                <div data-destination-actions>
                  <button type="button" class="admin-btn is-small admin-destination-action-toggle"
                          data-destination-action-toggle aria-expanded="false"
                          th:attr="aria-controls=|destination-actions-${dest.id}|,aria-label=|${dest.name} 관리 메뉴|">⋯</button>
                  <div class="admin-destination-action-panel" data-destination-action-panel hidden
                       th:id="|destination-actions-${dest.id}|" th:attr="aria-label=|${dest.name} 관리|" role="group">
                    <button type="button" class="admin-btn is-small" data-destination-visibility
                            th:attr="data-visibility-url=@{'/admin/destinations/' + ${dest.id} + '/visibility'},data-public-visible=${dest.publicVisible},aria-label=|${dest.name} ${dest.publicVisible ? '숨기기' : '공개하기'}|"
                            th:text="${dest.publicVisible} ? '숨기기' : '공개하기'">숨기기</button>
                    <!-- 삭제 후에도 지금 목록 조건(쪽 포함)으로 돌아온다. -->
                    <form th:action="@{'/admin/destinations/' + ${dest.id} + '/delete' + ${listQuery}}"
                          method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                      <button type="submit" class="admin-btn is-small is-danger">삭제</button>
                    </form>
                  </div>
                </div>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 쪽 이동. listUrl 에 지금 조건이 모두 들어 있어 page 만 바꿔 붙인다. -->
    <nav th:if="${totalPages > 1}" aria-label="여행지 목록 페이지">
      <ul class="admin-pagination">
        <li th:if="${currentPage > 1}">
          <a th:href="@{${listUrl}(page=${currentPage - 1})}">이전</a>
        </li>
        <li th:each="pageNumber : ${#numbers.sequence(pageStart, pageEnd)}"
            th:classappend="${pageNumber == currentPage} ? 'active'">
          <a th:href="${pageNumber == 1} ? @{${listUrl}} : @{${listUrl}(page=${pageNumber})}"
             th:text="${pageNumber}"
             th:attr="aria-current=${pageNumber == currentPage} ? 'page' : null">1</a>
        </li>
        <li th:if="${currentPage < totalPages}">
          <a th:href="@{${listUrl}(page=${currentPage + 1})}">다음</a>
        </li>
      </ul>
    </nav>
  </section>
</th:block>
</html>
