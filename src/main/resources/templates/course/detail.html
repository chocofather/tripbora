<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5.3.0/400.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-kr@5.3.0/400.css">
  <link rel="stylesheet" href="/css/quill-content.css">
  <link rel="stylesheet" href="/css/course-detail.css" />
  <link rel="stylesheet" href="/css/content-translation.css" />
  <link rel="stylesheet" href="/css/content-bookmark.css" />
  <link rel="stylesheet" href="/css/content-comment.css" />
  <link rel="stylesheet" href="/css/community-detail-mobile.css" />
  <script src="/js/comment-deep-link.js" defer></script>
  <script src="/js/confirm-submit.js" defer></script>
  <script src="/js/course-comments.js" defer></script>
  <script src="/js/community-comment-mobile.js" defer></script>
  <script src="/js/user-post-translation.js" defer></script>
  <script src="/js/content-bookmarks.js" defer></script>
  <script src="/js/course-hide-modal.js" defer></script>
  <script src="/js/course-detail.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <!-- 코스 댓글 스크립트가 쓰는 고정 문구. 화면에는 보이지 않는다. -->
  <div id="course-detail-i18n" hidden
       th:data-comment-loading="#{course.detail.comment.loading}"
       th:data-comment-load-more="#{course.detail.comment.loadMore}"
       th:data-comment-empty="#{course.detail.comment.empty}"
       th:data-comment-moderated="#{course.detail.comment.moderated}"
       th:data-comment-deleted="#{course.detail.comment.deleted}"
       th:data-comment-unknown-user="#{course.detail.comment.unknownUser}"
       th:data-comment-like="#{course.detail.comment.like}"
       th:data-comment-profile-alt="#{course.detail.comment.profileAlt}"
       th:data-comment-edited="#{course.detail.comment.edited}"
       th:data-comment-reply-to-deleted="#{course.detail.comment.replyToDeleted}"
       th:data-comment-reply="#{course.detail.comment.reply}"
       th:data-comment-edit="#{course.detail.comment.edit}"
       th:data-comment-delete="#{course.detail.comment.delete}"
       th:data-comment-save="#{course.detail.comment.save}"
       th:data-comment-cancel="#{course.detail.comment.cancel}"
       th:data-comment-submit="#{course.detail.comment.submit}"
       th:data-comment-photo="#{course.detail.comment.photo}"
       th:data-comment-reply-placeholder="#{course.detail.comment.replyPlaceholder}"
       th:data-comment-delete-confirm="#{course.detail.comment.deleteConfirm}"
       th:data-comment-image-alt="#{course.detail.comment.imageAlt}"
       th:data-comment-image-limit="#{course.detail.comment.imageLimit}"
       th:data-comment-file-preview="#{course.detail.comment.filePreview}"
       th:data-comment-file-remove="#{course.detail.comment.fileRemove}"
       th:data-comment-login-required="#{course.detail.comment.loginRequired}"
       th:data-comment-request-failed="#{course.detail.comment.requestFailed}"
       th:data-comment-invalid-response="#{course.detail.comment.invalidResponse}"
       th:data-comment-invalid-location-response="#{course.detail.comment.invalidLocationResponse}"></div>

  <main class="course-detail-container">
    <nav class="course-breadcrumb" aria-label="Breadcrumb">
      <a th:href="@{/board/list(boardType='course')}" th:text="#{search.type.course}">여행코스</a>
      <span aria-hidden="true">/</span>
      <span th:text="#{course.detail.label}">나만의 여행 코스</span>
    </nav>
    <article class="course-summary" data-title-content-translation
             th:data-translation-url="@{/course/{id}/translation(id=${course.id})}"
             th:data-translation-show="#{destination.detail.comment.translate}"
             th:data-translation-original="#{destination.detail.comment.original}"
             th:data-translation-loading="#{destination.detail.comment.translating}"
             th:data-translation-retry="#{destination.detail.comment.translationRetry}"
             th:data-translation-rate-limited="#{destination.detail.comment.translationRateLimited}"
             th:data-translation-failed="#{destination.detail.comment.translationFailed}">
      <header class="course-summary-header">
        <p class="course-summary-label">
          <span th:text="#{course.detail.label}">나만의 여행 코스</span>
          <span class="course-stop-count"
                th:if="${course.stops != null and !course.stops.isEmpty()}"
                th:text="#{course.detail.stopCount(${course.stops.size()})}">총 3개의 여행지</span>
        </p>
        <div class="content-detail-title-row course-title-row">
          <h1 id="course-translation-title" data-translation-title
              th:text="${course.title}">코스 제목</h1>
          <div class="course-header-actions">
            <button type="button"
                    class="content-bookmark-button"
                    th:classappend="${course.bookmarked} ? ' is-bookmarked'"
                    th:data-bookmark-url="@{/bookmarks/courses/{id}(id=${course.id})}"
                    th:data-bookmarked="${course.bookmarked}"
                    th:attr="aria-pressed=${course.bookmarked}">
              <span class="content-bookmark-image" aria-hidden="true"></span>
              <span class="content-bookmark-label"
                    th:text="${course.bookmarked} ? '북마크 취소' : '북마크 저장'">북마크 저장</span>
            </button>
            <details class="course-owner-menu" data-owner-menu th:if="${course.myCourse}">
              <summary class="course-owner-toggle"
                       th:aria-label="|#{course.detail.edit} / #{course.detail.delete}|">
                <span aria-hidden="true">⋯</span>
              </summary>
              <div class="course-owner-menu-panel">
                <a th:href="@{/course/{id}/edit(id=${course.id})}" class="course-edit-button"
                   th:text="#{course.detail.edit}">수정</a>
                <!-- 기존 POST/CSRF 및 confirm-submit.js 삭제 확인 계약을 유지한다. -->
                <form th:action="@{/course/{id}/delete(id=${course.id})}"
                      method="post" class="course-delete-form"
                      th:data-confirm="#{course.detail.deleteConfirm}">
                  <button type="submit" class="course-delete-button"
                          th:text="#{course.detail.delete}">삭제</button>
                </form>
              </div>
            </details>
            <!-- 관리자 moderation 전용 메뉴. 작성자 ⋯ 와 섞지 않고 ADMIN 에게만 렌더링한다. -->
            <details class="course-owner-menu course-admin-menu" data-owner-menu
                     sec:authorize="hasRole('ADMIN')">
              <summary class="course-owner-toggle course-admin-toggle" aria-label="코스 관리자 메뉴">
                <span>관리</span><span aria-hidden="true">▾</span>
              </summary>
              <div class="course-owner-menu-panel">
                <!-- 상세는 공개 상태에서만 열리므로 숨김만 노출한다.
                     숨김 해제는 기존 /admin/contents 조치 목록에서 처리한다. -->
                <button type="button" class="course-hide-button" data-course-hide-open>숨김</button>
              </div>
            </details>
          </div>
        </div>
        <dl class="course-meta">
          <!-- 최종 탈퇴 회원은 공개 프로필이 없으므로 링크 없이 공통 문구만 보여준다. -->
          <div><dt th:text="#{course.detail.meta.writer}">작성자</dt><dd><a
                                       th:unless="${course.writerWithdrawn}"
                                       class="content-writer-link"
                                       th:href="@{/users/{id}(id=${course.userId})}"
                                       th:text="${course.nickname}">작성자</a><span
                                       th:if="${course.writerWithdrawn}"
                                       class="content-writer-withdrawn"
                                       th:text="#{member.withdrawn}">탈퇴한 회원</span></dd></div>
          <div><dt th:text="#{course.detail.meta.createdAt}">작성일</dt><dd th:attr="data-mobile-date=${#dates.format(course.createdAt, 'yyyy.MM.dd')}" th:text="${#dates.format(course.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</dd></div>
          <div><dt th:text="#{course.detail.meta.updatedAt}">수정일</dt><dd th:attr="data-mobile-date=${#dates.format(course.updatedAt, 'yyyy.MM.dd')}" th:text="${#dates.format(course.updatedAt, 'yyyy-MM-dd HH:mm')}">수정일</dd></div>
          <div><dt th:text="#{course.detail.meta.views}">조회수</dt><dd th:text="${course.views}">0</dd></div>
        </dl>
        <div class="content-translation-control" th:if="${course.translationAvailable}">
          <button id="course-translation-toggle" type="button"
                  class="content-translation-button" data-translation-toggle
                  th:text="#{destination.detail.comment.translate}">번역 보기</button>
          <p id="course-translation-status" class="content-translation-status"
             data-translation-status role="status" hidden></p>
        </div>
      </header>

      <figure class="course-hero" data-course-hero
              th:if="${course.representativeImageUrl != null and !#strings.isEmpty(course.representativeImageUrl) and course.representativeImageUrl != '/images/default.png'}">
        <img class="course-hero-image" data-course-hero-image
             th:src="${course.representativeImageUrl}" th:alt="${course.title}"
             fetchpriority="high" />
      </figure>

      <section class="course-introduction">
        <h2 th:text="#{course.detail.section.introduction}">코스 소개</h2>
        <div id="course-translation-content"
             class="course-introduction-content rich-text-content"
             data-translation-content
             th:utext="${course.content}"></div>
      </section>
    </article>

    <section class="course-route" aria-labelledby="course-route-title">
      <div class="course-route-heading">
        <h2 id="course-route-title" th:text="#{course.detail.route.title}">여행 동선</h2>
      </div>

      <!-- JS가 꺼져 있으면 모든 Day가 순서대로 읽히고, 작동하지 않는 필터만 숨긴다. -->
      <nav class="course-day-nav" data-course-day-nav hidden
           th:if="${course.days != null and course.days.size() > 1}"
           th:aria-label="#{course.detail.route.title}">
        <button type="button" data-course-day-filter="all" aria-pressed="true"
                th:text="#{course.detail.route.allDays}">전체 일정</button>
        <button type="button" th:each="day : ${course.days}"
                th:data-course-day-filter="${day.dayNumber}" aria-pressed="false"
                th:aria-controls="|course-day-${day.dayNumber}|"
                th:text="|Day ${day.dayNumber}|">Day 1</button>
      </nav>

      <section class="course-day-route" th:each="day : ${course.days}"
               th:id="|course-day-${day.dayNumber}|" th:data-course-day="${day.dayNumber}"
               th:aria-labelledby="|course-day-title-${day.dayNumber}|">
        <h3 class="course-day-route-title" th:id="|course-day-title-${day.dayNumber}|">
          <span class="course-day-number" th:text="|Day ${day.dayNumber}|">Day 1</span>
          <span th:if="${day.title != null and !#strings.isEmpty(day.title)}" th:text="${day.title}"></span>
        </h3>
        <div class="course-timeline">
          <article class="course-stop" th:each="stop : ${day.items}">
            <div class="course-stop-marker" th:text="${stop.visitOrder}">1</div>
            <div class="course-stop-card">
              <h3 class="course-stop-heading">
                <span class="course-item-time" th:if="${stop.startTime != null and !#strings.isEmpty(stop.startTime)}"
                      th:text="${stop.startTime}"></span>
                <span class="course-item-time-separator" aria-hidden="true"
                      th:if="${stop.startTime != null and !#strings.isEmpty(stop.startTime)}">·</span>
                <a class="course-stop-title-link" th:href="@{/destinations/{id}(id=${stop.destinationId})}"
                   th:text="${stop.name}">장소명</a>
              </h3>
              <a class="course-stop-image-wrap" th:href="@{/destinations/{id}(id=${stop.destinationId})}">
                <img class="course-stop-image"
                     th:classappend="${stop.imageNoDerivatives} ? 'is-no-derivatives'"
                     th:src="${stop.imageUrl != null and !#strings.isEmpty(stop.imageUrl) ? stop.imageUrl : '/images/default.png'}"
                     th:alt="#{course.detail.stop.imageAlt(${stop.name})}" loading="lazy" />
              </a>
              <div class="course-stop-body">
                <span class="course-item-type"
                      th:text="${stop.itemType == 'STAY' ? '숙소' : (stop.itemType == 'FOOD' ? '음식' : '장소')}">장소</span>
                <p class="course-stop-description"
                   th:if="${stop.shortDescription != null and !#strings.isEmpty(#strings.trim(stop.shortDescription))}"
                   th:text="${stop.shortDescription}"></p>
                <details class="course-item-memo" th:if="${stop.memo != null and !#strings.isEmpty(stop.memo)}">
                  <summary><span th:text="${stop.memo}"></span></summary>
                </details>
                <p class="course-stop-region">
                  <span th:text="#{course.detail.stop.region}">지역</span>
                  <strong th:text="${stop.regionName}">지역명</strong>
                </p>
              </div>
            </div>
          </article>
        </div>
        <p class="course-route-empty" th:if="${day.items == null or day.items.isEmpty()}"
           th:text="#{course.detail.route.empty}">등록된 여행지가 없습니다.</p>
      </section>

      <div class="course-timeline" th:if="${(course.days == null or course.days.isEmpty()) and course.stops != null and !course.stops.isEmpty()}">
        <article th:each="stop : ${course.stops}"
                 class="course-stop">
          <div class="course-stop-marker" th:text="${stop.visitOrder}">1</div>

          <a class="course-stop-card"
             th:href="@{/destinations/{id}(id=${stop.destinationId})}">
            <h3 class="course-stop-heading">
              <span class="course-item-time" th:if="${stop.startTime != null and !#strings.isEmpty(stop.startTime)}"
                    th:text="${stop.startTime}"></span>
              <span class="course-item-time-separator" aria-hidden="true"
                    th:if="${stop.startTime != null and !#strings.isEmpty(stop.startTime)}">·</span>
              <span class="course-stop-title-link" th:text="${stop.name}">장소명</span>
            </h3>
            <div class="course-stop-image-wrap">
              <img class="course-stop-image"
                   th:classappend="${stop.imageNoDerivatives} ? 'is-no-derivatives'"
                   th:src="${stop.imageUrl != null and !#strings.isEmpty(stop.imageUrl) ? stop.imageUrl : '/images/default.png'}"
                   th:alt="#{course.detail.stop.imageAlt(${stop.name})}"
                   loading="lazy" />
            </div>

            <div class="course-stop-body">
              <p class="course-stop-description"
                 th:if="${stop.shortDescription != null and !#strings.isEmpty(#strings.trim(stop.shortDescription))}"
                 th:text="${stop.shortDescription}">간단 설명</p>
              <p class="course-stop-region">
                <span th:text="#{course.detail.stop.region}">지역</span>
                <strong th:text="${stop.regionName}">지역명</strong>
              </p>
            </div>
          </a>
        </article>
      </div>

      <p class="course-route-empty"
         th:if="${(course.days == null or course.days.isEmpty()) and (course.stops == null or course.stops.isEmpty())}"
         th:text="#{course.detail.route.empty}">등록된 여행지가 없습니다.</p>
    </section>

    <footer class="course-detail-footer">
      <!-- 목록 이동만 남긴다. 작성자/관리자 액션은 모두 제목 우측 메뉴로 모았다. -->
      <div class="course-detail-footer-row">
        <a th:href="@{/board/list(boardType='course')}" class="course-back-to-list">
          <span class="course-back-to-list-arrow" aria-hidden="true">←</span><span
              th:text="#{course.detail.backToList}">코스 목록으로</span>
        </a>
      </div>
    </footer>

    <!-- 숨김 사유 입력 모달 (ADMIN 전용) -->
    <div sec:authorize="hasRole('ADMIN')" id="course-hide-modal" class="course-hide-modal" hidden>
      <div class="course-hide-dialog" role="dialog" aria-modal="true"
           aria-labelledby="course-hide-title">
        <button type="button" class="course-hide-close" data-course-hide-close
                aria-label="닫기">&times;</button>
        <h2 id="course-hide-title" class="course-hide-title">코스 숨김</h2>
        <p class="course-hide-text">이 코스를 숨김 처리하시겠습니까?</p>
        <form th:action="@{/admin/contents/COURSE/{id}/hide(id=${course.id})}"
              method="post" class="course-hide-form">
          <input type="hidden" name="redirect" th:value="@{/board/list(boardType='course')}">
          <label class="course-hide-label" for="course-hide-reason">숨김 사유</label>
          <textarea id="course-hide-reason" name="reason" rows="3" maxlength="500" required
                    class="course-hide-reason" placeholder="사유를 입력해 주세요."></textarea>
          <div class="course-hide-actions">
            <button type="button" class="course-hide-cancel" data-course-hide-close>취소</button>
            <button type="submit" class="course-hide-submit">숨김 처리</button>
          </div>
        </form>
      </div>
    </div>

    <section id="course-comments" class="course-comments content-comments"
             th:attr="data-course-id=${course.id}"
             th:data-translation-show="#{destination.detail.comment.translate}"
             th:data-translation-original="#{destination.detail.comment.original}"
             th:data-translation-loading="#{destination.detail.comment.translating}"
             th:data-translation-retry="#{destination.detail.comment.translationRetry}"
             th:data-translation-rate-limited="#{destination.detail.comment.translationRateLimited}"
             th:data-translation-failed="#{destination.detail.comment.translationFailed}">
      <div class="content-comment-toolbar">
        <h2 class="content-comment-heading">
          <span th:text="#{course.detail.comment.heading}">댓글</span>
          <span id="course-comment-count">0</span>
        </h2>
        <div class="content-comment-sort" role="group"
             th:aria-label="#{course.detail.comment.sortLabel}" aria-label="댓글 정렬">
          <button type="button" class="is-active" data-comment-sort="latest" aria-pressed="true"
                  th:text="#{course.detail.comment.sort.latest}">최신순</button>
          <button type="button" data-comment-sort="oldest" aria-pressed="false"
                  th:text="#{course.detail.comment.sort.oldest}">오래된순</button>
          <button type="button" data-comment-sort="likes" aria-pressed="false"
                  th:text="#{course.detail.comment.sort.likes}">좋아요순</button>
        </div>
      </div>

      <form id="course-comment-form" class="course-comment-form" enctype="multipart/form-data"
            th:if="${#authorization.expression('isAuthenticated()')}">
        <label for="course-comment-content" class="sr-only"
               th:text="#{course.detail.comment.contentLabel}">댓글 내용</label>
        <textarea id="course-comment-content" name="content" maxlength="2000"
                  th:placeholder="#{course.detail.comment.placeholder}"
                  placeholder="댓글을 입력해 주세요." required></textarea>

        <!-- 선택한 사진 미리보기 (등록 전) -->
        <div class="comment-image-preview" id="course-comment-image-preview" hidden></div>

        <div class="course-comment-form-actions">
          <span class="course-comment-length"><span id="course-comment-length">0</span>/2000</span>
          <input type="file" id="course-comment-image-input" name="images" accept="image/*" multiple hidden>
          <label for="course-comment-image-input" class="image-upload-label">
            <img src="/uploads/icons/camera.png" alt="" aria-hidden="true">
            <span th:text="#{course.detail.comment.photo}">사진</span>
          </label>
          <button type="submit" th:text="#{course.detail.comment.submit}">등록</button>
        </div>
      </form>

      <div class="course-comment-guest"
           th:unless="${#authorization.expression('isAuthenticated()')}">
        <label for="course-comment-content" class="sr-only"
               th:text="#{course.detail.comment.contentLabel}">댓글 내용</label>
        <textarea id="course-comment-content" readonly data-guest-comment-redirect
                  th:placeholder="#{destination.detail.comment.loginPrompt}"></textarea>
      </div>

      <p id="course-comment-message" class="course-comment-message" role="alert" hidden></p>
      <ul id="course-comment-list" class="course-comment-list content-comment-list" aria-live="polite"></ul>
      <div class="content-comment-more-row">
        <button id="course-comment-more" type="button" class="content-comment-more" hidden
                th:text="#{course.detail.comment.loadMore}">댓글 더보기</button>
      </div>

      <!-- 댓글 사진 확대 모달. 이동은 클릭한 댓글에 첨부된 사진 안에서만 순환한다 -->
      <div id="course-comment-image-modal" class="image-modal" style="display:none;">
        <span class="close-btn" role="button"
              th:aria-label="#{course.detail.comment.image.close}" aria-label="닫기">&times;</span>
        <button type="button" class="comment-image-nav prev"
                th:aria-label="#{course.detail.comment.image.previous}"
                aria-label="이전 사진">&#10094;</button>
        <img class="modal-content" id="course-comment-modal-img"
             th:alt="#{course.detail.comment.image.enlargedAlt}" alt="확대 이미지">
        <button type="button" class="comment-image-nav next"
                th:aria-label="#{course.detail.comment.image.next}"
                aria-label="다음 사진">&#10095;</button>
      </div>
    </section>
  </main>
</th:block>
</html>
