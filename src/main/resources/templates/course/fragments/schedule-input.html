<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="scheduleInput">
      <div hidden aria-hidden="true" th:if="${course != null}">
        <div th:each="day : ${course.days}" data-initial-day
             th:attr="data-day-id=${day.id},data-title=${day.title}">
          <span th:each="stop : ${day.items}" data-initial-destination
                th:attr="data-destination-id=${stop.destinationId},data-item-id=${stop.itemId},data-name=${stop.name},
                         data-address=${stop.address},data-latitude=${stop.latitude},data-longitude=${stop.longitude},
                         data-region-name=${stop.regionName},data-location-label=${stop.locationLabel},data-country-id=${stop.countryId},data-country-code=${stop.countryCode},
                         data-country-name=${stop.countryName},data-thumbnail-url=${stop.imageUrl},
                         data-image-no-derivatives=${stop.imageNoDerivatives},
                         data-start-time=${stop.startTime},
                         data-memo=${stop.memo},data-item-type=${stop.itemType}"></span>
        </div>
      </div>

      <select id="course-country-options" hidden aria-hidden="true" tabindex="-1">
        <option th:each="country : ${courseCountries}" data-course-country
                th:value="${country.id}"
                th:attr="data-country-id=${country.id},data-country-name=${country.regionName},data-country-code=${country.code}"
                th:text="${country.regionName}"></option>
      </select>

      <section class="selected-course-section" aria-labelledby="selected-course-title">
        <div class="picker-heading course-schedule-heading">
          <h2 id="selected-course-title">여행 일정</h2>
          <span class="write-mobile-selection-count" id="selected-course-count" aria-live="polite">1일 · 0곳</span>
          <p>하루씩 일정을 채워보세요. 여행지를 누르면 바로 아래에서 시간과 메모를 편집할 수 있어요.</p>
        </div>
        <div class="course-day-navigation">
          <div id="course-day-tabs" class="course-day-tabs" role="tablist" aria-label="여행 Day 선택"></div>
          <button type="button" id="course-add-day" class="btn btn-secondary">+ Day</button>
        </div>
        <div id="selected-destinations" class="course-days"></div>
        <section id="course-search-panel" class="course-search-inline" hidden aria-labelledby="destination-search-title">
          <div class="course-search-heading">
            <h3 id="destination-search-title">여행지 검색</h3>
            <p id="course-search-target"></p>
          </div>
          <div id="course-linked-search" class="destination-search-controls">
            <label for="destination-search-input" class="sr-only">여행지 검색어</label>
            <input type="search" id="destination-search-input" placeholder="장소명이나 지역 검색" autocomplete="off" />
            <button type="button" id="destination-search-button" class="btn btn-secondary">검색</button>
          </div>
          <p id="course-search-message" class="course-write-message" role="status" aria-live="polite"></p>
          <div id="destination-search-results" class="destination-search-results" aria-label="여행지 검색 결과" tabindex="0"></div>
          <div class="course-search-footer">
            <span>여러 여행지를 이어서 추가할 수 있어요.</span>
            <button type="button" id="course-search-close" class="btn btn-secondary">검색 닫기</button>
          </div>
        </section>
        <p class="course-day-help">최대 90일 · Day당 50곳 · 각 Day에 한 곳 이상 필요합니다.</p>
        <p id="course-write-message" class="course-write-message" role="status" aria-live="polite"></p>
        <div id="destination-id-inputs"></div>
      </section>
</th:block>
</body>
</html>
