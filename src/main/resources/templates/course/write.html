<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill-resize-module@2.1.3/dist/resize.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5.3.0/400.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-kr@5.3.0/400.css">
  <link rel="stylesheet" href="/css/quill-content.css">
  <link rel="stylesheet" href="/css/course-write.css" />
  <link rel="stylesheet" href="/css/course-location.css" />
  <link rel="stylesheet" href="/css/community-write-mobile.css">
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/quill-resize-module@2.1.3/dist/resize.js" defer></script>
  <script src="/js/quill-editor-init.js" defer></script>
  <script src="/js/map-init.js" defer></script>
  <script src="/js/course-location.js" defer></script>
  <script src="/js/course-write.js" defer></script>
  <script src="/js/course-cover.js" defer></script>
  <script src="/js/course-themes.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <div class="course-write-wrapper">
    <h1>나만의 여행코스 글쓰기</h1>

    <form id="course-form"
          th:action="@{/course/write}"
          method="post"
          enctype="multipart/form-data"
          class="write-form"
          data-initial-content-id="initial-content">

      <p class="course-write-message is-error" role="alert" th:if="${formError}" th:text="${formError}"></p>

      <!-- 제목 -->
      <h2 class="write-mobile-section-title">기본 정보</h2>
      <div class="form-group">
        <label class="write-mobile-field-label" for="course-title">제목</label>
        <input type="text"
               id="course-title"
               name="title"
               th:value="${course != null ? course.title : ''}"
               placeholder="코스 제목을 입력하세요"
               maxlength="255"
               required
               class="input-text" />
      </div>

      <div th:replace="~{course/fragments/cover-input :: coverInput}"></div>
      <section th:replace="~{course/fragments/themes :: picker}"></section>

      <!-- 에디터 -->
      <div class="form-group editor-group">
        <span class="write-mobile-field-label">소개</span>
        <div class="course-editor-shell quill-editor-shell">
          <div id="editor" class="course-editor quill-editor"></div>
        </div>
        <input type="hidden" name="content" id="content-input" />
        <textarea id="initial-content" hidden th:if="${course != null}" th:text="${course.content}"></textarea>
      </div>

      <th:block th:replace="~{course/fragments/schedule-input :: scheduleInput}"></th:block>


      <!-- 버튼 그룹 -->
      <div class="button-group course-save-bar">
        <button type="submit" id="course-submit-button" class="btn btn-primary">코스 등록</button>
        <a th:href="@{/board/list?boardType=course}"
           class="btn btn-secondary">취소</a>
      </div>
    </form>

  </div>

</th:block>
</html>
