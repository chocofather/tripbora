<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <!-- 본문 작성은 프로젝트에서 이미 쓰는 Quill 2.0.3 을 그대로 사용한다 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">
  <link rel="stylesheet" href="/css/quill-content.css">
  <link rel="stylesheet" href="/css/diary.css">
  <!-- 다이어리 전용 글꼴 (이 화면에서만 불러온다).
       .diary-font-{키} 는 화면 곳곳(한 줄 메모/글꼴 버튼)에 덧붙이는 글꼴 지정이므로
       같은 우선순위인 diary.css 의 font-family 보다 뒤에 와야 실제로 적용된다. -->
  <link rel="stylesheet" href="/css/diary-fonts.css">
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <!-- 편집 저장이 지나는 공통 통로. 아래 모듈들보다 먼저 실려야 한다.
       이 화면(회원)에서는 예전과 같은 서버 POST 를 그대로 쓴다. -->
  <script src="/js/diary-save-transport.js" defer></script>
  <script src="/js/diary-canvas-drag.js" defer></script>
  <!-- 되풀이형 마스킹테이프는 읽기 화면에서도 같은 모습이어야 하므로 편집 여부와 무관하게 싣는다 -->
  <script src="/js/diary-tape-repeat.js" defer></script>
  <!-- 표지와 전체 내지를 CDN 호출 없이 브라우저에서 한 장씩 이미지/PDF로 만든다 -->
  <script src="/webjars/html-to-image/1.11.13/dist/html-to-image.js" defer></script>
  <script src="/webjars/jspdf/3.0.1/dist/jspdf.umd.min.js" defer></script>
  <script src="/js/diary-pdf.js" defer></script>
  <script src="/js/diary-emoji-data.js" defer></script>
  <script src="/js/diary-editor.js" defer></script>
  <script src="/js/diary-page-scale.js" defer></script>
  <script src="/js/diary-page-flip.js" defer></script>
  <!-- 좁은 화면 읽기: 펼침 단위가 아니라 모든 장을 한 장씩 이어서 넘긴다 -->
  <script src="/js/diary-mobile-pages.js" defer></script>
  <script src="/js/diary-photo-picker.js" defer></script>
  <script src="/js/diary-sticker-picker.js" defer></script>
  <!-- 꾸미기 팝오버의 라벨/메모지 갈래. 스티커 쪽과 같은 팝오버를 함께 쓴다 -->
  <script src="/js/diary-note-picker.js" defer></script>
  <!-- 라벨/메모지에 글쓰기. 두 번 눌렀을 때와 갓 붙였을 때만 열린다 -->
  <script src="/js/diary-note-text.js" defer></script>
  <!-- 꾸미기 팝오버의 라벨기 갈래. 글씨만 붙인다 (NOTE 라벨과 다른 기능) -->
  <script src="/js/diary-label-picker.js" defer></script>
  <script src="/js/diary-paper-color.js" defer></script>
</th:block>

<th:block th:fragment="body">
  <!-- 기본은 읽기 모드. 편집은 ?edit=true 일 때만 열린다. (권한은 서버에서 따로 확인) -->
  <section class="diary-detail-page" aria-labelledby="diary-detail-title"
           th:classappend="${editMode} ? ' is-edit-mode' : ' is-read-mode'">
    <!--
      제목과 기간·장수를 한 덩어리로 두고, 다이어리 단위 액션은 그 오른쪽 끝에 세운다.
      (장마다 붙는 연필은 그 장 위에 있어야 하므로 아래 읽기 도구 줄에 그대로 둔다)
    -->
    <header class="diary-detail-header">
      <a class="diary-detail-back" th:href="@{/diaries}">← 나의 여행일기로</a>

      <div class="diary-detail-headline">
        <div class="diary-detail-heading">
          <h1 id="diary-detail-title" th:text="${diary.title}">여행일기 제목</h1>
          <p class="diary-detail-meta">
            <time th:text="|${diary.startDate} ~ ${diary.endDate}|">2026-08-01 ~ 2026-08-05</time>
            <span class="diary-detail-meta-dot" aria-hidden="true">·</span>
            <span th:text="|전체 ${#lists.size(diaryPages)}장|">전체 0장</span>
          </p>
        </div>

        <!--
          새 페이지 추가는 장이 아니라 다이어리에 대한 일이라 여기 둔다.
          읽기 화면의 펼침이 바뀌어도 이 자리는 다시 그려지지 않는다.
        -->
        <div class="diary-detail-actions" th:unless="${editMode}">
          <button type="button" class="diary-pdf-download" data-diary-pdf-button
                  th:data-diary-pdf-cover-template="diary-pdf-cover-template"
                  th:data-diary-pdf-spread-url="@{/diaries/{id}/spread(id=${diary.id})}"
                  th:data-diary-pdf-total-spreads="${totalSpreads}"
                  th:data-diary-pdf-page-count="${#lists.size(diaryPages)}"
                  th:data-diary-title="${diary.title}">
            <span class="diary-pdf-download-label">PDF 다운로드</span>
          </button>
          <details class="diary-page-add">
            <summary class="diary-page-add-button is-labelled" title="새 페이지 추가">
              <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round">
                <path d="M8 3.4v9.2M3.4 8h9.2"/>
              </svg>
              <span>페이지 추가</span>
            </summary>
            <form th:action="@{/diaries/{id}/pages(id=${diary.id})}" method="post">
              <label>
                <span>페이지 날짜</span>
                <input type="date" name="pageDate" required
                       th:attr="min=${diary.startDate},max=${diary.endDate}"
                       th:value="${diary.startDate}" />
              </label>
              <label>
                <span>페이지 배경</span>
                <select name="backgroundType">
                  <option value="PLAIN">무지</option>
                  <option value="LINED">줄노트</option>
                  <option value="GRID">모눈</option>
                  <option value="DOT">도트</option>
                </select>
              </label>
              <div class="diary-text-edit-actions">
                <button type="submit" class="diary-text-action is-primary">추가</button>
              </div>
            </form>
          </details>
        </div>
      </div>
    </header>

    <!-- 화면에는 만들지 않고 보관하는 적용 표지 markup. PDF 때만 복제해 A5 원본 크기로 캡처한다. -->
    <template id="diary-pdf-cover-template" th:unless="${editMode}">
      <div class="diary-book" data-diary-pdf-cover-context
           th:classappend="${diary.coverStyle != null and !#strings.isEmpty(diary.coverStyle)}
                           ? ' diary-cover-'
                             + ${#strings.replace(#strings.toLowerCase(diary.coverStyle), '_', '-')} : ''">
        <div class="diary-book-cover" data-diary-pdf-cover>
          <th:block th:replace="~{diary/cover-preview :: appliedCover(
                     ${diary}, ${pdfCover}, ${pdfCoverElements})}"></th:block>
        </div>
      </div>
    </template>

    <p class="diary-flash-message" th:if="${diaryMessage}" th:text="${diaryMessage}"
       role="status">새 페이지가 추가되었습니다.</p>
    <p class="diary-form-error" th:if="${diaryPageError}" th:text="${diaryPageError}"
       role="alert">입력값을 확인해 주세요.</p>

    <!-- 편집 액션 세 개는 툴바 바로 위 오른쪽에 한 줄로 모은다.
         (th:replace 가 th:if 보다 먼저 처리되므로 조건은 바깥 th:block 에 둔다) -->
    <th:block th:if="${editMode and editPage != null}">
      <div class="diary-page-meta" th:replace="~{diary/detail :: pageMeta(${editPage})}"></div>
    </th:block>

    <!-- 펼친 다이어리 공통 편집 툴바. 명령은 지금 쓰고 있는 쪽(active page)에만 적용된다. -->
    <div class="diary-toolbar" th:if="${editMode and !#lists.isEmpty(diaryPages)}"
         role="toolbar" aria-label="본문 편집 도구">
      <span class="diary-edit-badge">편집 중</span>
      <div class="diary-toolbar-group diary-font-picker">
        <span class="diary-toolbar-label" id="diary-font-label">글꼴</span>
        <!-- 목록은 diary-editor.js 가 채우고, 항목 이름은 그 글꼴로 미리 보여준다 -->
        <button type="button" class="diary-font-trigger" id="diary-font-trigger"
                aria-haspopup="listbox" aria-expanded="false"
                aria-controls="diary-font-list" aria-labelledby="diary-font-label diary-font-trigger">기본</button>
        <div class="diary-font-list" id="diary-font-list" role="listbox"
             aria-label="글꼴 고르기" hidden></div>

        <label class="diary-toolbar-label" for="diary-size">글자 크기</label>
        <select class="diary-toolbar-select" id="diary-size" data-editor-command="size">
          <option value="small">작게</option>
          <option value="">보통</option>
          <option value="large">크게</option>
          <option value="huge">아주 크게</option>
        </select>
      </div>

      <div class="diary-toolbar-group">
        <button type="button" class="diary-toolbar-button" data-editor-command="bold"
                title="굵게" aria-label="굵게" aria-pressed="false"><strong>B</strong></button>
        <button type="button" class="diary-toolbar-button" data-editor-command="italic"
                title="기울임" aria-label="기울임" aria-pressed="false"><em>I</em></button>
        <button type="button" class="diary-toolbar-button" data-editor-command="underline"
                title="밑줄" aria-label="밑줄" aria-pressed="false"><u>U</u></button>

        <label class="diary-toolbar-label" for="diary-color">글자 색</label>
        <input type="color" class="diary-toolbar-color" id="diary-color" value="#000000"
               data-editor-command="color" aria-label="글자 색" />

        <!-- 형광펜: 색 목록은 diary-editor.js 가 채운다 (일반 배경색 입력이 아니다).
             색을 고르면 형광펜을 든 상태가 되고, 본문에서 문장을 드래그하면 칠해진다. -->
        <span class="diary-toolbar-label" id="diary-highlight-label">형광펜</span>
        <span class="diary-highlight">
          <button type="button" class="diary-highlight-trigger" id="diary-highlight-trigger"
                  aria-haspopup="listbox" aria-expanded="false" aria-pressed="false"
                  aria-controls="diary-highlight-palette"
                  aria-labelledby="diary-highlight-label diary-highlight-trigger"
                  title="형광펜">
            <span class="diary-highlight-icon" aria-hidden="true">🖍</span>
            <span class="diary-highlight-current" id="diary-highlight-current"
                  aria-hidden="true"></span>
          </button>
          <div class="diary-highlight-palette" id="diary-highlight-palette" role="listbox"
               aria-label="형광펜 색 고르기" hidden></div>
        </span>

        <label class="diary-toolbar-label" for="diary-align">정렬</label>
        <select class="diary-toolbar-select" id="diary-align" data-editor-command="align">
          <option value="">왼쪽</option>
          <option value="center">가운데</option>
          <option value="right">오른쪽</option>
          <option value="justify">양쪽</option>
        </select>
      </div>

      <div class="diary-toolbar-group diary-emoji">
        <button type="button" class="diary-toolbar-button" id="diary-emoji-button"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="diary-emoji-popover"
                title="이모지" aria-label="이모지 넣기">😊</button>
        <!-- 기본은 닫힘. 탭/목록은 diary-editor.js 가 채운다 (외부 이모지 라이브러리 없음) -->
        <div class="diary-emoji-popover" id="diary-emoji-popover" role="dialog"
             aria-label="이모지 고르기" hidden>
          <div class="diary-emoji-tabs" id="diary-emoji-tabs"
               role="tablist" aria-label="이모지 분류"></div>
          <div class="diary-emoji-grid" id="diary-emoji-grid" role="group"
               aria-label="이모지 목록"></div>
        </div>
      </div>

      <!--
        사진: 종이 안이 아니라 여기서 고른다. 생성 경로/폼은 기존 PHOTO 흐름 그대로다.
        어떤 모습으로 붙을지는 등록하는 자리가 정한다 — 일반 사진과 폴라로이드가
        각자 파일 고르개를 따로 갖고, 고른 자리의 값이 photoStyle 로 함께 전송된다.
        (표지 디자인 편집과 같은 UX 다. 붙인 뒤에 모습을 바꾸는 길은 두지 않는다)
      -->
      <div class="diary-toolbar-group" th:if="${editPage != null}">
        <form class="diary-photo-add"
              th:action="@{/diaries/{diaryId}/pages/{pageId}/elements/photo
                          (diaryId=${diary.id},pageId=${editPage.id})}"
              method="post" enctype="multipart/form-data">
          <input type="hidden" name="spread" th:value="${currentSpread}" />
          <input type="hidden" name="page" th:value="${editPage.pageOrder}" />
          <!-- 고른 자리의 모습을 담아 함께 보낸다. (허용 값 확인은 서버가 한다) -->
          <input type="hidden" name="photoStyle" value="" data-photo-style-value />

          <th:block th:each="style : ${diaryPhotoStyles}">
            <input type="file" class="diary-photo-input" name="image" accept="image/*" multiple
                   th:id="|diary-photo-input-${editPage.id}-${style.code}|"
                   th:data-photo-style="${style.code}"
                   th:attr="aria-label=|${style.label} 사진 추가|" />
            <!-- 사진임을 바로 알 수 있는 outline 아이콘 (이모지 문자 대신 inline SVG) -->
            <label class="diary-toolbar-button diary-photo-button"
                   th:for="|diary-photo-input-${editPage.id}-${style.code}|"
                   th:title="|${style.label} 사진 추가|">
              <svg class="diary-toolbar-icon" viewBox="0 0 20 20" aria-hidden="true"
                   fill="none" stroke="currentColor" stroke-width="1.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.5" y="4" width="15" height="12" rx="2" />
                <circle cx="7" cy="8" r="1.4" />
                <path d="M3 13.5l3.6-3.2a1.4 1.4 0 0 1 1.9 0l2.7 2.5 1.8-1.5a1.4 1.4 0 0 1 1.8 0L17 13.2" />
              </svg>
              <span th:text="${style.label}">일반</span>
            </label>
          </th:block>

          <span class="diary-photo-status" role="status" hidden>올리는 중…</span>
        </form>
      </div>

      <!-- 스티커: DB 카탈로그에서 고르면 지금 편집 중인 장에 바로 붙는다.
           분류/스티커 모두 서버가 조회한 목록을 그대로 그리므로
           스티커를 늘려도 이 마크업은 손대지 않는다. -->
      <div class="diary-toolbar-group diary-sticker-picker" th:if="${editPage != null}">
        <button type="button" class="diary-toolbar-button" id="diary-sticker-button"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="diary-sticker-popover"
                th:attr="data-create-url=@{/diaries/{diaryId}/pages/{pageId}/elements/sticker
                                          (diaryId=${diary.id},pageId=${editPage.id})},
                         data-note-create-url=@{/diaries/{diaryId}/pages/{pageId}/elements/note
                                                (diaryId=${diary.id},pageId=${editPage.id})}"
                title="꾸미기" aria-label="스티커·라벨·메모지·글씨 붙이기">✦</button>
        <div class="diary-sticker-popover" id="diary-sticker-popover" role="dialog"
             aria-label="꾸미기 고르기" hidden>
          <!--
            무엇을 붙일지 먼저 고른다. 스티커 / 라벨 / 메모지.
            아래 스티커 묶음은 예전 그대로이고, 이 줄만 그 위에 얹혔다.
            (id 는 스티커 시절 이름을 그대로 둔다. 화면에 보이는 말과 달리
             diary-sticker-picker.js 가 붙잡고 있는 손잡이라 바꾸지 않는다)
          -->
          <div class="diary-decor-tabs" role="tablist" aria-label="꾸미기 종류">
            <button type="button" class="diary-decor-tab is-active" role="tab"
                    aria-selected="true" data-decor-tab="sticker">스티커</button>
            <button type="button" class="diary-decor-tab" role="tab"
                    aria-selected="false" data-decor-tab="label">라벨</button>
            <button type="button" class="diary-decor-tab" role="tab"
                    aria-selected="false" data-decor-tab="memo">메모지</button>
            <!-- 라벨기(글씨만 붙이기)는 도구 줄의 자기 버튼으로 옮겼다. 여기 갈래가 아니다 -->
          </div>

          <!-- 스티커 묶음. 여기 안쪽은 예전 구조 그대로다 -->
          <div class="diary-decor-panel" data-decor-panel="sticker">
          <!-- 분류 탭. 목록이 늘어나면 가로로만 조금 넘겨 본다.
               '최근' 은 DB 분류가 아니라 이 브라우저에만 남는 화면용 탭이다. -->
          <div class="diary-sticker-tabs" role="tablist" aria-label="스티커 분류">
            <button type="button" class="diary-sticker-tab" role="tab"
                    data-sticker-category="recent" aria-selected="false"
                    aria-controls="diary-sticker-grid-recent">최근</button>
            <button type="button" class="diary-sticker-tab" role="tab"
                    th:each="category, stat : ${diaryStickerCategories}"
                    th:data-sticker-category="${category.id}"
                    th:classappend="${stat.first} ? ' is-active' : ''"
                    th:attr="aria-selected=${stat.first} ? 'true' : 'false',
                             aria-controls=|diary-sticker-grid-${category.id}|"
                    th:text="${category.name}">여행</button>
          </div>

          <!-- 분류별 그리드. 고른 분류만 보여 준다. (스크롤은 이 안에서만 생긴다) -->
          <div class="diary-sticker-panels">
            <!-- 최근 쓴 스티커. 내용은 아래 분류의 버튼을 그대로 옮겨 담는다.
                 (지금 목록에 없는 스티커는 담기지 않는다) -->
            <div class="diary-sticker-grid" role="group" id="diary-sticker-grid-recent"
                 data-sticker-category="recent" aria-label="최근 사용한 스티커" hidden>
              <p class="diary-sticker-empty" id="diary-sticker-recent-empty">
                아직 사용한 스티커가 없어요.
              </p>
            </div>

            <div class="diary-sticker-grid" role="group"
                 th:each="category, stat : ${diaryStickerCategories}"
                 th:id="|diary-sticker-grid-${category.id}|"
                 th:data-sticker-category="${category.id}"
                 th:attr="aria-label=|${category.name} 스티커|"
                 th:hidden="${!stat.first}">
              <!-- 마스킹테이프만 안에서 한 번 더 나눠 본다. (상단 분류 탭은 그대로) -->
              <div class="diary-sticker-subfilter" th:if="${category.id == 'masking-tape'}"
                   role="group" aria-label="마스킹테이프 종류">
                <button type="button" class="diary-sticker-subtab is-active"
                        data-tape-type="ALL" aria-pressed="true">전체</button>
                <button type="button" class="diary-sticker-subtab"
                        data-tape-type="NORMAL" aria-pressed="false">일반</button>
                <button type="button" class="diary-sticker-subtab"
                        data-tape-type="TRANSLUCENT" aria-pressed="false">반투명</button>
                <button type="button" class="diary-sticker-subtab"
                        data-tape-type="CLEAR" aria-pressed="false">클리어</button>
              </div>

              <!--
                표현 스타일(기본 / 리얼)은 화면에서 고르지 않는다. 여행 묶음을 열면
                기본 스티커와 리얼 스티커가 한 grid 에 그대로 섞여 나온다.
                collection 은 asset 을 갈라 두기 위한 내부 값으로만 남아 아래 속성에 실린다.
              -->

              <!-- 마스킹테이프처럼 가로로 긴 스티커는 두 칸을 써서 디자인이 보이게 한다 -->
              <button type="button" class="diary-sticker-option"
                      th:each="sticker : ${category.stickers}"
                      th:data-sticker-id="${sticker.id}"
                      th:data-sticker-kind="${sticker.kind}"
                      th:data-sticker-collection="${sticker.collectionCode}"
                      th:data-tape-type="${sticker.tapeType}"
                      th:data-access-tier="${sticker.accessTier}"
                      th:title="${sticker.name}"
                      th:attr="aria-label=|${sticker.name} 스티커 붙이기|">
                <img th:src="${sticker.imageUrl}" alt="" aria-hidden="true" loading="lazy" />
                <span class="diary-sticker-premium-badge"
                      th:if="${sticker.accessTier.name() == 'PREMIUM'}"
                      aria-hidden="true">P</span>
              </button>
            </div>
          </div>
          </div>

          <!--
            라벨 / 떡메모지. 그림 파일이 없으므로 실제로 붙었을 때와 같은 class 로 미리 보여 준다.
            (diary-note-* 는 종이 위의 NOTE 가 쓰는 바로 그 규칙이다)
            안에 적힌 글은 모양을 알아보기 위한 보기 글일 뿐 저장되지 않는다.
            붙이면 글이 빈 채로 만들어지고, 글을 쓰는 길은 다음 단계에서 붙는다.
          -->
          <div class="diary-decor-panel" data-decor-panel="label" hidden>
            <!--
              색 고르기. 목록은 서버가 manifest 대로 그려 주므로 여기 색을 적지 않는다.
              고른 색은 아래 미리보기에 곧바로 반영되고, 붙일 때 함께 보내진다.
              "기본" 은 색을 고르지 않은 상태다 — 그 모양이 원래 쓰는 색으로 붙는다.
            -->
            <div th:replace="~{diary/detail :: noteSwatches('라벨')}"></div>

            <div class="diary-note-grid" role="group" aria-label="라벨">
              <button type="button" class="diary-note-option"
                      th:each="style : ${diaryLabelStyles}"
                      th:data-note-style="${style.code}"
                      th:title="${style.label}"
                      th:attr="aria-label=|${style.label} 붙이기|">
                <span class="diary-note-preview" th:classappend="${style.styleClass}"
                      aria-hidden="true">
                  <span class="diary-note-surface">
                    <span class="diary-note-text" th:text="${style.sample}">2026.08.28</span>
                  </span>
                </span>
                <span class="diary-note-option-label" th:text="${style.label}">날짜 라벨</span>
              </button>
            </div>
          </div>

          <div class="diary-decor-panel" data-decor-panel="memo" hidden>
            <!-- 라벨과 같은 팔레트를 쓰지만 고른 색은 갈래마다 따로 기억한다 -->
            <div th:replace="~{diary/detail :: noteSwatches('메모지')}"></div>

            <div class="diary-note-grid is-memo" role="group" aria-label="메모지">
              <button type="button" class="diary-note-option"
                      th:each="style : ${diaryMemoStyles}"
                      th:data-note-style="${style.code}"
                      th:title="${style.label}"
                      th:attr="aria-label=|${style.label} 붙이기|">
                <span class="diary-note-preview is-memo"
                      th:classappend="${style.styleClass}" aria-hidden="true">
                  <span class="diary-note-surface">
                    <span class="diary-note-text" th:text="${style.sample}">오늘의 기록</span>
                  </span>
                </span>
                <span class="diary-note-option-label" th:text="${style.label}">사각 메모지</span>
              </button>
            </div>
          </div>

          <p class="diary-sticker-status" id="diary-sticker-status" role="status"></p>
        </div>
      </div>

      <!--
        라벨기: 종이 배경 없이 글씨만 붙인다. (꾸미기 팝오버의 '라벨'(NOTE)과 다른 기능)
        표지 디자인 편집과 같은 조각·같은 여닫이 규칙을 쓰고 붙일 자리(createUrl)만 다르다.
        여닫이는 diary-label-picker.js 가 버튼/판 id 를 보고 스스로 맡는다.
      -->
      <div class="diary-toolbar-group diary-sticker-picker" th:if="${editPage != null}">
        <button type="button" class="diary-toolbar-button" id="diary-label-button"
                aria-haspopup="dialog" aria-expanded="false"
                aria-controls="diary-label-popover"
                title="라벨기" aria-label="글씨 붙이기">
          <svg class="diary-toolbar-icon" viewBox="0 0 16 16" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.3"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.4 4.2h7.2" />
            <path d="M8 4.2v7.6" />
            <path d="M6.4 11.8h3.2" />
          </svg>
        </button>
        <div class="diary-sticker-popover diary-label-popover" id="diary-label-popover"
             role="dialog" aria-label="라벨기" hidden>
          <div th:replace="~{diary/label-maker :: picker(${diaryLabelFonts},
                             @{/diaries/{diaryId}/pages/{pageId}/elements/label
                               (diaryId=${diary.id},pageId=${editPage.id})})}"></div>
          <!-- 붙이기 결과는 이 판 안에서 보여 준다. (스티커 판이 닫혀 있어도 읽힌다) -->
          <p class="diary-sticker-status" id="diary-label-status" role="status"></p>
        </div>
      </div>

      <!-- 한 줄 메모 전용 서식. 본문 Quill 글꼴/굵기와는 서로 영향을 주지 않는다. -->
      <div class="diary-toolbar-group diary-header-style" th:if="${editPage != null}">
        <span class="diary-toolbar-label" id="diary-header-font-label">한 줄 메모</span>
        <!-- 목록은 본문 글꼴과 같은 16종을 diary-editor.js 가 채운다 -->
        <button type="button" class="diary-font-trigger is-compact" id="diary-header-font-trigger"
                aria-haspopup="listbox" aria-expanded="false"
                aria-controls="diary-header-font-list"
                aria-labelledby="diary-header-font-label diary-header-font-trigger">기본</button>
        <div class="diary-font-list" id="diary-header-font-list" role="listbox"
             aria-label="한 줄 메모 글꼴 고르기" hidden></div>

        <button type="button" class="diary-toolbar-button" id="diary-header-bold"
                title="한 줄 메모 굵게" aria-label="한 줄 메모 굵게"
                aria-pressed="false"><strong>B</strong></button>
      </div>

      <p class="diary-save-status" id="diary-save-status" role="status">저장됨</p>
    </div>

    <!-- 편집 모드: 한 장만 크게 펼쳐 놓고 집중해서 쓴다. (읽기 모드 2페이지 구조는 그대로 둔다)
         스프링 노트의 종이 구멍은 펼친 책의 제본 쪽에 둔다. 홀짝은 읽기 펼침과 같은 기준(다이어리 안 순서 editPageNumber)이다.
         홀수 = 왼쪽 장 → 오른쪽 가장자리, 짝수 = 오른쪽 장 → 왼쪽 가장자리. -->
    <div class="diary-book-single" th:if="${editMode}"
         th:classappend="|${notebookClass} ${editPageNumber % 2 == 1 ? 'is-holes-right' : 'is-holes-left'}|">
      <div class="diary-sheet-viewport" data-diary-sheet-viewport>
      <!-- 종이색은 --diary-paper-color 변수만 덮어써서 무늬/질감 위에 그대로 얹는다.
           (서버가 #RRGGBB 만 저장하므로 임의 CSS 가 들어올 수 없다) -->
      <article class="diary-sheet diary-sheet-single"
               th:classappend="${editPage != null and editPage.backgroundType != null}
                               ? ' diary-sheet-bg-' + ${#strings.toLowerCase(editPage.backgroundType)} : ''"
               th:style="${editPage != null and editPage.paperColor != null}
                         ? '--diary-paper-color:' + ${editPage.paperColor} : null">
        <!-- 편집은 한 장 집중 화면이라 제본 장식 없이 종이만 둔다. -->
        <th:block th:if="${editPage != null}">
          <div class="diary-sheet-head"
               th:replace="~{diary/detail :: sheetHead(${editPage})}"></div>
          <div class="diary-sheet-body"
               th:replace="~{diary/detail :: sheetBody(${editPage})}"></div>
          <p class="diary-sheet-number" th:text="${editPage.pageOrder}">1</p>
          <!-- 자유배치 층은 종이 전체를 기준으로 삼도록 종이 바로 아래에 둔다 -->
          <div class="diary-canvas"
               th:replace="~{diary/detail :: sheetCanvas(${editPage}, ${editElements})}"></div>
        </th:block>

        <!-- 아직 페이지가 한 장도 없는 다이어리. 위의 폼으로 첫 장을 만든다. -->
        <div class="diary-sheet-empty" th:if="${editPage == null}">
          <p class="diary-sheet-empty-title">아직 작성한 페이지가 없습니다.</p>
          <p class="diary-sheet-empty-text">여행의 첫 장을 남겨보세요.</p>
        </div>

        <!-- 스프링 노트의 코일. 편집 화면에서는 CSS 가 감추고 종이 구멍만 남긴다. (읽기 화면 코일은 그대로) -->
        <span class="diary-sheet-spring" th:if="${spiralNotebook}" aria-hidden="true"></span>
      </article>
      </div>
    </div>

    <!-- 편집 모드 이동: 실제 페이지 한 장씩. 저장이 끝난 뒤에 이동한다.
         (이동 경로/저장 흐름은 그대로 두고 모양만 작은 화살표로 줄였다) -->
    <nav class="diary-spread-nav is-compact" th:if="${editMode and editPage != null}"
         aria-label="페이지 이동">
      <a th:if="${hasPreviousPage}" class="diary-spread-arrow" data-editor-done="true"
         th:href="@{/diaries/{id}(id=${diary.id},spread=${currentSpread},edit=true,page=${previousPageOrder})}"
         title="이전 페이지" aria-label="이전 페이지">&#8249;</a>
      <span th:unless="${hasPreviousPage}" class="diary-spread-arrow is-disabled"
            aria-disabled="true" aria-hidden="true">&#8249;</span>

      <span class="diary-spread-position"
            th:text="|${editPageNumber} / ${#lists.size(diaryPages)}|">2 / 6</span>

      <a th:if="${hasNextPage}" class="diary-spread-arrow" data-editor-done="true"
         th:href="@{/diaries/{id}(id=${diary.id},spread=${currentSpread},edit=true,page=${nextPageOrder})}"
         title="다음 페이지" aria-label="다음 페이지">&#8250;</a>
      <span th:unless="${hasNextPage}" class="diary-spread-arrow is-disabled"
            aria-disabled="true" aria-hidden="true">&#8250;</span>
    </nav>

    <!--
      읽기 화면에서 펼침이 바뀔 때 이 안쪽만 통째로 갈아 끼운다.
      (서버가 그린 그대로를 쓰므로 새로고침/직접 접근과 화면이 완전히 같다)
    -->
    <!-- data-page-count: 좁은 화면에서 모든 장을 한 줄로 넘길 때 "현재 / 전체 N장" 에 쓴다 (diary-mobile-pages.js) -->
    <div id="diary-read-board" th:fragment="readBoard" th:unless="${editMode}"
         th:data-spread-url="@{/diaries/{id}/spread(id=${diary.id})}"
         th:data-spread="${currentSpread}"
         th:data-page-count="${#lists.size(diaryPages)}">

    <!--
      종이 바깥 위쪽 줄. 왼쪽/오른쪽 장마다 연필 하나씩 두어 그 장의 편집으로 바로 간다.
      (고르는 창 없이 바로 이동한다. 실제로 있는 장에만 보인다)
      맨 오른쪽 + 는 새 페이지 추가로, 폼과 저장 경로는 예전 그대로다.
    -->
    <div class="diary-read-tools">
      <div class="diary-read-tools-page">
        <a class="diary-page-edit" th:if="${leftPage != null}"
           th:href="@{/diaries/{id}(id=${diary.id},spread=${currentSpread},
                      edit=true,page=${leftPage.pageOrder})}"
           th:title="|${leftPage.pageOrder}페이지 편집|"
           th:attr="aria-label=|${leftPage.pageOrder}페이지 편집|">
          <svg class="diary-page-edit-icon" viewBox="0 0 16 16" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.6 2.4 13.6 5.4 5.6 13.4 2.2 14 2.6 10.6Z"/>
            <path d="M9.4 3.6 12.4 6.6"/>
          </svg>
        </a>
      </div>

      <div aria-hidden="true"></div>

      <div class="diary-read-tools-page is-right">
        <a class="diary-page-edit" th:if="${rightPage != null}"
           th:href="@{/diaries/{id}(id=${diary.id},spread=${currentSpread},
                      edit=true,page=${rightPage.pageOrder})}"
           th:title="|${rightPage.pageOrder}페이지 편집|"
           th:attr="aria-label=|${rightPage.pageOrder}페이지 편집|">
          <svg class="diary-page-edit-icon" viewBox="0 0 16 16" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.6 2.4 13.6 5.4 5.6 13.4 2.2 14 2.6 10.6Z"/>
            <path d="M9.4 3.6 12.4 6.6"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- 펼친 공책: 왼쪽 페이지 / 중앙 제본선 / 오른쪽 페이지 (읽기 모드)
         공책 모양(일반 / 스프링)은 여기 클래스 하나로만 갈린다. 안쪽 구조는 두 모양이 같다. -->
    <div class="diary-book-spread" th:classappend="${notebookClass}">
      <!-- 좌/우 종이색은 서로 독립이다. (같은 색으로 맞추지 않는다) -->
      <div class="diary-sheet-viewport" data-diary-sheet-viewport>
      <article class="diary-sheet diary-sheet-left"
               th:data-diary-page-order="${leftPage?.pageOrder}"
               th:classappend="${leftPage != null and leftPage.backgroundType != null}
                               ? ' diary-sheet-bg-' + ${#strings.toLowerCase(leftPage.backgroundType)} : ''"
               th:style="${leftPage != null and leftPage.paperColor != null}
                         ? '--diary-paper-color:' + ${leftPage.paperColor} : null">
        <th:block th:if="${leftPage != null}">
          <div class="diary-sheet-head"
               th:replace="~{diary/detail :: sheetHead(${leftPage})}"></div>
          <div class="diary-sheet-body"
               th:replace="~{diary/detail :: sheetBody(${leftPage})}"></div>
          <p class="diary-sheet-number" th:text="${leftPage.pageOrder}">1</p>
          <div class="diary-canvas"
               th:replace="~{diary/detail :: sheetCanvas(${leftPage}, ${leftElements})}"></div>
        </th:block>

        <!-- 아직 페이지가 한 장도 없는 다이어리. 위의 폼으로 첫 장을 만든다. -->
        <div class="diary-sheet-empty" th:if="${leftPage == null}">
          <p class="diary-sheet-empty-title">아직 작성한 페이지가 없습니다.</p>
          <p class="diary-sheet-empty-text">여행의 첫 장을 남겨보세요.</p>
        </div>

        <!-- 한 장씩 넘겨 보는 좁은 화면에서만 쓰는 장 왼쪽 코일 (넓은 화면에서는 감춘다) -->
        <span class="diary-sheet-spring" th:if="${spiralNotebook}" aria-hidden="true"></span>
      </article>
      </div>

      <!-- 두 장 사이의 칸.
           일반 노트는 여기를 비워 두 장이 이어진 한 면처럼 보이게 하고,
           스프링 노트만 이 자리에 제본의 그늘을 남긴다. (코일은 이 칸 위를 지난다) -->
      <div class="diary-book-gutter" aria-hidden="true"></div>

      <div class="diary-sheet-viewport" data-diary-sheet-viewport>
      <article class="diary-sheet diary-sheet-right"
               th:data-diary-page-order="${rightPage?.pageOrder}"
               th:classappend="${rightPage != null and rightPage.backgroundType != null}
                               ? ' diary-sheet-bg-' + ${#strings.toLowerCase(rightPage.backgroundType)} : ''"
               th:style="${rightPage != null and rightPage.paperColor != null}
                         ? '--diary-paper-color:' + ${rightPage.paperColor} : null">
        <th:block th:if="${rightPage != null}">
          <div class="diary-sheet-head"
               th:replace="~{diary/detail :: sheetHead(${rightPage})}"></div>
          <div class="diary-sheet-body"
               th:replace="~{diary/detail :: sheetBody(${rightPage})}"></div>
          <p class="diary-sheet-number" th:text="${rightPage.pageOrder}">2</p>
          <div class="diary-canvas"
               th:replace="~{diary/detail :: sheetCanvas(${rightPage}, ${rightElements})}"></div>
        </th:block>
        <!-- 오른쪽 장이 아직 없으면 빈 종이로 둔다 -->
        <span class="diary-sheet-spring" th:if="${spiralNotebook}" aria-hidden="true"></span>
      </article>
      </div>

      <!--
        스프링 노트의 코일. 두 장 사이 제본 자리를 지난다.
        종이 상자 밖에 얹는 장식이라 종이 안쪽 크기/여백을 건드리지 않는다.
      -->
      <span class="diary-book-spring" th:if="${spiralNotebook}" aria-hidden="true"></span>
    </div>

    <!-- 펼침 단위 이동(읽기 모드). 현재 위치는 spread 쿼리 파라미터로만 관리한다.
         이동 경로/키보드 이동/비활성 처리는 그대로 두고 모양만 작은 화살표로 줄였다. -->
    <nav class="diary-spread-nav is-read" th:if="${!#lists.isEmpty(diaryPages)}"
         aria-label="페이지 이동">
      <a th:if="${hasPreviousSpread}" class="diary-spread-arrow" data-flip="previous"
         th:href="@{/diaries/{id}(id=${diary.id},spread=${currentSpread - 1})}"
         title="이전 페이지" aria-label="이전 페이지">&#8249;</a>
      <span th:unless="${hasPreviousSpread}" class="diary-spread-arrow is-disabled"
            aria-disabled="true" aria-hidden="true">&#8249;</span>

      <span class="diary-spread-position"
            th:text="${rightPage != null}
                     ? |${leftPage.pageOrder}-${rightPage.pageOrder} / 전체 ${#lists.size(diaryPages)}장|
                     : |${leftPage.pageOrder} / 전체 ${#lists.size(diaryPages)}장|">1-2 / 전체 6장</span>

      <a th:if="${hasNextSpread}" class="diary-spread-arrow" data-flip="next"
         th:href="@{/diaries/{id}(id=${diary.id},spread=${currentSpread + 1})}"
         title="다음 페이지" aria-label="다음 페이지">&#8250;</a>
      <span th:unless="${hasNextSpread}" class="diary-spread-arrow is-disabled"
            aria-disabled="true" aria-hidden="true">&#8250;</span>
    </nav>
    </div>
  </section>
</th:block>

<!--
  라벨/메모지 색 고르기 한 줄.

  라벨과 메모지가 같은 팔레트를 쓰므로 조각 하나를 나눠 쓴다.
  색 목록은 서버(diary_notes.json)가 그려 주고, 스와치의 색도 실제로 붙었을 때와
  같은 class(diary-note-color-*)로 칠해진다. 여기에 색 값을 적지 않는다.
  data-note-color 가 빈 값인 첫 칸이 "기본"(=고르지 않음)이다.
-->
<!-- 고를 수 있는 색만 둔다. "색 없음" 자리는 두지 않는다 —
     고르지 않고 붙이면 맨 앞 색(기본색)으로 붙으므로 처음부터 그 색이 눌려 있다. -->
<div th:fragment="noteSwatches(kind)" class="diary-note-swatches"
     role="group" th:attr="aria-label=|${kind} 색|">
  <button type="button" class="diary-note-swatch"
          th:each="color, stat : ${diaryNoteColors}"
          th:classappend="${color.cssClass} + (${stat.first} ? ' is-active' : '')"
          th:data-note-color="${color.code}"
          th:data-note-color-class="${color.cssClass}"
          th:attr="aria-pressed=${stat.first} ? 'true' : 'false',
                   aria-label=|${color.label} 색|"
          th:title="${color.label}"></button>
</div>

<!-- 한 장의 머리말: 종이 안에는 날짜/한 줄 메모 같은 내용만 두고,
     사진 등 관리 액션은 종이 밖(상단 편집 툴바 / pageMeta)에 있다 -->
<div th:fragment="sheetHead(page)" class="diary-sheet-head">
  <!-- 날짜는 페이지 정보라 고정이고, 그 오른쪽 빈 자리만 한 줄 메모로 쓴다.
       글꼴/굵기는 메모에만 적용하고 날짜에는 적용하지 않는다. -->
  <div class="diary-sheet-head-row">
    <time class="diary-sheet-date" th:text="${page.pageDate}">2026-08-01</time>

    <!-- 편집 모드: 종이에 바로 적는 느낌의 한 줄. 자동저장은 diary-editor.js 가 맡는다. -->
    <input th:if="${editMode}" type="text" class="diary-sheet-header-input"
           th:classappend="${(page.pageHeaderFont != null and page.pageHeaderFont != 'DEFAULT')
                             ? ' diary-font-' + page.pageHeaderFont : ''}
                           + ${(page.pageHeaderBold != null and page.pageHeaderBold) ? ' is-bold' : ''}"
           maxlength="100" autocomplete="off" placeholder="오늘의 한 줄..."
           aria-label="이 페이지의 한 줄 메모"
           th:value="${page.pageHeader}"
           th:data-header-font="${page.pageHeaderFont != null ? page.pageHeaderFont : 'DEFAULT'}"
           th:data-header-bold="${(page.pageHeaderBold != null and page.pageHeaderBold) ? 'true' : 'false'}"
           th:data-header-url="@{/diaries/{diaryId}/pages/{pageId}/header
                                 (diaryId=${diary.id},pageId=${page.id})}" />

    <!-- 읽기 모드: 적어 둔 메모를 저장 당시 글꼴/굵기 그대로 보여준다.
         비어 있으면 아무것도 두지 않는다. -->
    <th:block th:unless="${editMode}">
      <span class="diary-sheet-header"
            th:if="${page.pageHeader != null and !#strings.isEmpty(page.pageHeader)}"
            th:classappend="${(page.pageHeaderFont != null and page.pageHeaderFont != 'DEFAULT')
                              ? ' diary-font-' + page.pageHeaderFont : ''}
                            + ${(page.pageHeaderBold != null and page.pageHeaderBold) ? ' is-bold' : ''}"
            th:text="${page.pageHeader}">제주 여행 첫째 날</span>
    </th:block>
  </div>
</div>

<!-- 종이 바깥 상단 줄: 왼쪽에 페이지 번호/날짜, 오른쪽에 페이지 관리 액션 -->
<!-- 툴바 바로 위 오른쪽 줄. 날짜/쪽번호는 종이 안·아래 이동 줄에 있으므로 아이콘만 둔다. -->
<div th:fragment="pageMeta(page)" class="diary-page-meta">
  <!-- 세 액션을 같은 크기·같은 모양으로 나란히 둔다 (완료 → 설정 → 삭제) -->
  <div class="diary-page-actions">
    <!-- 저장이 끝난 뒤, 편집하던 장이 들어 있는 펼침으로 돌아간다 (JS 가 처리) -->
    <a class="diary-page-action" data-editor-done="true"
       th:href="@{/diaries/{id}(id=${diary.id},spread=${editSpread != null ? editSpread : currentSpread})}"
       title="편집 완료" aria-label="편집 완료">
      <svg class="diary-page-action-icon" viewBox="0 0 16 16" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.4 8.6 6.6 11.8 12.8 4.6"/>
      </svg>
    </a>

    <details class="diary-page-settings">
      <summary class="diary-page-action diary-page-settings-toggle"
               title="페이지 설정" aria-label="페이지 설정">
        <svg class="diary-page-action-icon" viewBox="0 0 16 16" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path d="M2 4.5h4M9 4.5h5M2 11.5h5M10 11.5h4" />
          <circle cx="7.5" cy="4.5" r="1.8" />
          <circle cx="8.5" cy="11.5" r="1.8" />
        </svg>
      </summary>
      <form th:action="@{/diaries/{diaryId}/pages/{pageId}/update
                        (diaryId=${diary.id},pageId=${page.id})}" method="post">
        <input type="hidden" name="spread" th:value="${currentSpread}" />
        <!-- 편집 모드는 한 장씩 보므로 돌아올 페이지를 함께 보낸다 -->
        <input type="hidden" name="page" th:value="${page.pageOrder}" />
        <label>
          <span>날짜</span>
          <input type="date" name="pageDate" required
                 th:attr="min=${diary.startDate},max=${diary.endDate}"
                 th:value="${page.pageDate}" />
        </label>
        <label>
          <span>배경</span>
          <select name="backgroundType">
            <option value="PLAIN" th:selected="${page.backgroundType == 'PLAIN'}">무지</option>
            <option value="LINED" th:selected="${page.backgroundType == 'LINED'}">줄노트</option>
            <option value="GRID" th:selected="${page.backgroundType == 'GRID'}">모눈</option>
            <option value="DOT" th:selected="${page.backgroundType == 'DOT'}">도트</option>
          </select>
        </label>
        <!-- 종이 색상. 고른 값은 hidden 으로 담기고 서버가 #RRGGBB 만 저장한다.
             (기본을 고르면 빈 값 → paper_color NULL) -->
        <div class="diary-paper-color">
          <span class="diary-paper-color-label">종이 색상</span>
          <input type="hidden" name="paperColor" class="diary-paper-color-value"
                 th:value="${page.paperColor}" />
          <div class="diary-paper-color-swatches" role="radiogroup" aria-label="종이 색상">
            <button type="button" class="diary-paper-swatch is-default" data-paper-color=""
                    title="기본" aria-label="기본 종이색" aria-pressed="true"></button>
            <button type="button" class="diary-paper-swatch" data-paper-color="#FFFFFF"
                    style="--diary-swatch:#FFFFFF" title="화이트"
                    aria-label="화이트" aria-pressed="false"></button>
            <!-- 예전 기본 종이색이던 따뜻한 아이보리는 프리셋으로 남긴다 -->
            <button type="button" class="diary-paper-swatch" data-paper-color="#FDFAF3"
                    style="--diary-swatch:#FDFAF3" title="아이보리"
                    aria-label="아이보리" aria-pressed="false"></button>
            <button type="button" class="diary-paper-swatch" data-paper-color="#FFF9E8"
                    style="--diary-swatch:#FFF9E8" title="버터"
                    aria-label="버터" aria-pressed="false"></button>
            <button type="button" class="diary-paper-swatch" data-paper-color="#F7F0DC"
                    style="--diary-swatch:#F7F0DC" title="크림"
                    aria-label="크림" aria-pressed="false"></button>
            <button type="button" class="diary-paper-swatch" data-paper-color="#FCEBEC"
                    style="--diary-swatch:#FCEBEC" title="연분홍"
                    aria-label="연분홍" aria-pressed="false"></button>
            <button type="button" class="diary-paper-swatch" data-paper-color="#FBE9DD"
                    style="--diary-swatch:#FBE9DD" title="피치"
                    aria-label="피치" aria-pressed="false"></button>
            <button type="button" class="diary-paper-swatch" data-paper-color="#FFF5CC"
                    style="--diary-swatch:#FFF5CC" title="연노랑"
                    aria-label="연노랑" aria-pressed="false"></button>
            <button type="button" class="diary-paper-swatch" data-paper-color="#EAF4E3"
                    style="--diary-swatch:#EAF4E3" title="연초록"
                    aria-label="연초록" aria-pressed="false"></button>
            <button type="button" class="diary-paper-swatch" data-paper-color="#E8F2F8"
                    style="--diary-swatch:#E8F2F8" title="연하늘"
                    aria-label="연하늘" aria-pressed="false"></button>
            <button type="button" class="diary-paper-swatch" data-paper-color="#F1EAF7"
                    style="--diary-swatch:#F1EAF7" title="연보라"
                    aria-label="연보라" aria-pressed="false"></button>
          </div>
          <label class="diary-paper-color-custom">
            <input type="color" class="diary-paper-color-picker"
                   th:value="${page.paperColor != null} ? ${page.paperColor} : '#FDFDFA'" />
            <span>직접 선택</span>
          </label>
        </div>

        <div class="diary-text-edit-actions">
          <button type="submit" class="diary-text-action is-primary">저장</button>
        </div>
      </form>
    </details>

    <form th:action="@{/diaries/{diaryId}/pages/{pageId}/delete
                      (diaryId=${diary.id},pageId=${page.id})}"
          method="post"
          onsubmit="return confirm('이 페이지와 페이지의 글·사진이 모두 삭제됩니다. 삭제하시겠습니까?');">
      <input type="hidden" name="spread" th:value="${currentSpread}" />
      <button type="submit" class="diary-page-action is-danger"
              title="페이지 삭제" aria-label="페이지 삭제">
        <svg class="diary-page-action-icon" viewBox="0 0 16 16" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.8 4.4h10.4M6.4 4.4V2.9h3.2v1.5" />
          <path d="M4.2 4.4 4.9 13.2h6.2l.7-8.8" />
          <path d="M6.7 6.9v3.8M9.3 6.9v3.8" />
        </svg>
      </button>
    </form>
  </div>
</div>

<!-- 한 장의 본문: 종이에 바로 쓰는 글. (자유배치 사진/스티커는 종이 전체를 덮는 sheetCanvas 가 맡는다) -->
<div th:fragment="sheetBody(page)" class="diary-sheet-body">
  <!-- 글쓰기 층. 편집 모드에서만 저장 주소를 실어 Quill 이 붙고,
       읽기 모드에서는 정리된 본문 HTML 을 그대로 보여주기만 한다. -->
  <div class="diary-writing-layer">
    <div class="diary-editor"
         th:classappend="${editMode} ? '' : ' is-read-only'"
         th:data-page-id="${page.id}"
         th:attr="data-content-url=${editMode}
                  ? @{/diaries/{diaryId}/pages/{pageId}/content
                      (diaryId=${diary.id},pageId=${page.id})} : null"
         th:utext="${page.content}"></div>
  </div>
</div>

<!-- 자유배치 캔버스.
     종이(.diary-sheet) 전체를 덮으므로 읽기/편집의 종이 크기가 달라도 상대 좌표(0~1)가 같은 자리를 가리킨다.
     날짜/한 줄 메모/본문 영역과 무관하게 종이 어디에나 놓을 수 있다. -->
<div th:fragment="sheetCanvas(page, elements)" class="diary-canvas">
    <th:block th:each="element : ${elements}">
      <!-- 사진. 모습(일반/폴라로이드)은 붙일 때 정해져 저장된 값 하나로 결정된다.
           값이 없는 예전 사진은 폴라로이드로 그린다. (element.photoStyleClass) -->
      <figure class="diary-canvas-item diary-canvas-photo diary-photo"
              th:if="${element.elementType == 'PHOTO'}"
              th:classappend="${element.photoStyleClass}"
              th:data-element-id="${element.id}"
              th:data-element-type="${element.elementType}"
              th:data-position-x="${element.positionX}"
              th:data-position-y="${element.positionY}"
              th:data-width="${element.width}"
              th:data-height="${element.height}"
              th:data-rotation="${element.rotation}"
              th:data-position-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/position
                                      (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-size-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/size
                                  (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-rotation-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/rotation
                                      (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-layer-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/layer
                                   (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:style="|left:${element.positionX * 100}%;
                         top:${element.positionY * 100}%;
                         width:${element.width * 100}%;
                         height:${element.height * 100}%;
                         transform:rotate(${element.rotation}deg);
                         --diary-item-rotation:${element.rotation}deg;
                         z-index:${element.zIndex};|">
        <!-- 사진은 저장 경로가 아니라 소유권·PIN 을 확인하는 통제된 주소로만 연다 (viewUrl) -->
        <img th:src="${element.viewUrl}" alt="여행일기 사진" loading="lazy" />

        <!-- 조작 UI 는 편집 모드에서만 만든다. 읽기 모드에는 사진만 남는다. -->
        <th:block th:if="${editMode}">
          <div th:replace="~{diary/detail :: canvasHandles}"></div>

          <!-- 선택했을 때만 보이는 액션 줄. 사진 바깥 아래에 두어 이미지를 가리지 않는다. -->
          <div class="diary-layer-actions">
            <button type="button" class="diary-layer-action"
                    data-layer-direction="BACKWARD">뒤로</button>
            <button type="button" class="diary-layer-action"
                    data-layer-direction="FORWARD">앞으로</button>
            <!-- 삭제는 화면을 새로 고치지 않고 이 요소만 지운다 (diary-canvas-drag.js) -->
            <button type="button" class="diary-layer-action is-danger"
                    data-delete-confirm="이 사진을 삭제하시겠습니까?"
                    th:data-delete-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/photo/delete
                                          (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}">삭제</button>
          </div>
        </th:block>
      </figure>

      <!-- 스티커. 사진과 같은 자유배치 요소지만 사진 액자/그림자는 쓰지 않는다.
           되풀이해서 그리는 스티커(마스킹테이프)는 저장된 그림 경로로 조각을 찾아 함께 실어 준다.
           실제로 조각을 이어 붙이는 일은 diary-tape-repeat.js 한 곳이 맡는다. -->
      <figure class="diary-canvas-item diary-canvas-sticker diary-sticker"
              th:if="${element.elementType == 'STICKER'}"
              th:with="tape=${stickerRepeats.get(element.imageUrl)}"
              th:data-element-id="${element.id}"
              th:data-element-type="${element.elementType}"
              th:data-sticker-kind="${element.stickerKind}"
              th:data-tape-left="${tape?.leftUrl}"
              th:data-tape-center="${tape?.centerUrl}"
              th:data-tape-right="${tape?.rightUrl}"
              th:data-position-x="${element.positionX}"
              th:data-position-y="${element.positionY}"
              th:data-width="${element.width}"
              th:data-height="${element.height}"
              th:data-rotation="${element.rotation}"
              th:data-position-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/position
                                      (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-size-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/size
                                  (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-rotation-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/rotation
                                      (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-layer-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/layer
                                   (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:style="|left:${element.positionX * 100}%;
                         top:${element.positionY * 100}%;
                         width:${element.width * 100}%;
                         height:${element.height * 100}%;
                         transform:rotate(${element.rotation}deg);
                         --diary-item-rotation:${element.rotation}deg;
                         z-index:${element.zIndex};|">
        <img th:src="${element.imageUrl}" alt="여행일기 스티커" loading="lazy" />

        <!-- 조작 UI 는 편집 모드에서만 만든다. 읽기 모드에는 스티커 그림만 남는다. -->
        <th:block th:if="${editMode}">
          <div th:replace="~{diary/detail :: canvasHandles}"></div>

          <!-- 사진과 같은 액션 줄 구조. 공용 asset 이라 요소 행만 지운다. -->
          <div class="diary-layer-actions">
            <button type="button" class="diary-layer-action"
                    data-layer-direction="BACKWARD">뒤로</button>
            <button type="button" class="diary-layer-action"
                    data-layer-direction="FORWARD">앞으로</button>
            <!-- 떼기도 화면을 새로 고치지 않고 이 요소만 지운다 (diary-canvas-drag.js) -->
            <button type="button" class="diary-layer-action is-danger"
                    data-delete-confirm="이 스티커를 떼시겠습니까?"
                    th:data-delete-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/sticker/delete
                                          (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}">떼기</button>
          </div>
        </th:block>
      </figure>
      <!-- 라벨 / 떡메모지. 배경과 글자가 한 요소로 함께 움직인다.
           (배경 스티커 + 글 요소를 따로 두고 겹치는 방식이 아니다)
           자리·크기·회전·겹침 순서는 사진·스티커와 똑같은 상대좌표를 쓴다.
           모양은 저장된 style_type 하나로 정해진다 (element.noteStyleClass). -->
      <figure class="diary-canvas-item diary-note"
              th:if="${element.elementType == 'NOTE'}"
              th:classappend="${element.noteStyleClass}
                              + (${element.noteColorClass} != null
                                 ? ' ' + ${element.noteColorClass} : '')"
              th:data-element-id="${element.id}"
              th:data-element-type="${element.elementType}"
              th:data-note-style="${element.styleType}"
              th:data-position-x="${element.positionX}"
              th:data-position-y="${element.positionY}"
              th:data-width="${element.width}"
              th:data-height="${element.height}"
              th:data-rotation="${element.rotation}"
              th:data-position-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/position
                                      (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-size-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/size
                                  (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-rotation-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/rotation
                                      (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-layer-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/layer
                                   (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-text-url="${editMode}
                  ? @{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/text
                      (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})} : null"
              th:style="|left:${element.positionX * 100}%;
                         top:${element.positionY * 100}%;
                         width:${element.width * 100}%;
                         height:${element.height * 100}%;
                         transform:rotate(${element.rotation}deg);
                         --diary-item-rotation:${element.rotation}deg;
                         z-index:${element.zIndex};|">
        <!-- 종이 한 장과 그 위의 글. 사용자가 쓴 값이라 글자로만 넣는다.
             고쳐 쓸 수 있게 되는 것은 편집 모드에서 두 번 눌렀을 때뿐이다
             (contenteditable 은 그때 붙는다 — diary-note-text.js). -->
        <div class="diary-note-surface">
          <div class="diary-note-text" th:text="${element.textContent}">제주 카페 투어</div>
        </div>

        <!-- 조작 UI 는 편집 모드에서만 만든다. 읽기 모드에는 종이와 글만 남는다. -->
        <th:block th:if="${editMode}">
          <div th:replace="~{diary/detail :: canvasHandles}"></div>

          <!-- 사진·스티커와 같은 액션 줄 구조. 공용 asset 이 아니라 요소 행만 지운다.
               라벨/메모지에만 글 편집이 하나 더 붙는다. (두 번 누르기와 같은 일을 한다) -->
          <div class="diary-layer-actions">
            <button type="button" class="diary-layer-action"
                    data-note-edit>글 편집</button>
            <button type="button" class="diary-layer-action"
                    data-layer-direction="BACKWARD">뒤로</button>
            <button type="button" class="diary-layer-action"
                    data-layer-direction="FORWARD">앞으로</button>
            <button type="button" class="diary-layer-action is-danger"
                    data-delete-confirm="이 라벨을 떼시겠습니까?"
                    th:data-delete-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/note/delete
                                          (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}">떼기</button>
          </div>
        </th:block>
      </figure>

      <!-- 라벨기로 붙인 글씨. 종이 배경도 테두리도 없이 글자만 놓인다.
           글꼴은 저장된 값 하나로 정해지고(element.textFontClass), 값이 없으면 기본 글꼴이다.
           자리·크기·회전·겹침 순서는 사진·스티커와 똑같은 상대좌표를 쓴다. -->
      <figure class="diary-canvas-item diary-label"
              th:if="${element.elementType == 'TEXT'}"
              th:data-element-id="${element.id}"
              th:data-element-type="${element.elementType}"
              th:data-position-x="${element.positionX}"
              th:data-position-y="${element.positionY}"
              th:data-width="${element.width}"
              th:data-height="${element.height}"
              th:data-rotation="${element.rotation}"
              th:data-position-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/position
                                      (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-size-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/size
                                  (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-rotation-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/rotation
                                      (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:data-layer-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/layer
                                   (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}"
              th:style="|left:${element.positionX * 100}%;
                         top:${element.positionY * 100}%;
                         width:${element.width * 100}%;
                         height:${element.height * 100}%;
                         transform:rotate(${element.rotation}deg);
                         --diary-item-rotation:${element.rotation}deg;
                         --diary-label-chars:${#strings.length(element.textContent)};
                         z-index:${element.zIndex};|">
        <!-- 사용자가 쓴 값이라 글자로만 넣는다.
             색을 고른 글씨만 색을 입힌다 (서버가 #RRGGBB 만 저장한다).
             비어 있으면 규칙의 기본 먹색으로 그려진다. -->
        <span class="diary-label-text" th:classappend="${element.textFontClass}"
              th:style="${element.textColor != null and !#strings.isEmpty(element.textColor)}
                        ? 'color:' + ${element.textColor} : null"
              th:text="${element.textContent}">JEJU 2026</span>

        <!-- 조작 UI 는 편집 모드에서만 만든다. 읽기 모드에는 글씨만 남는다. -->
        <th:block th:if="${editMode}">
          <div th:replace="~{diary/detail :: canvasHandles}"></div>

          <!-- 스티커와 같은 액션 줄 구조. 글씨는 파일을 갖지 않아 요소 행만 지운다. -->
          <div class="diary-layer-actions">
            <button type="button" class="diary-layer-action"
                    data-layer-direction="BACKWARD">뒤로</button>
            <button type="button" class="diary-layer-action"
                    data-layer-direction="FORWARD">앞으로</button>
            <button type="button" class="diary-layer-action is-danger"
                    data-delete-confirm="이 글씨를 떼시겠습니까?"
                    th:data-delete-url="@{/diaries/{diaryId}/pages/{pageId}/elements/{elementId}/label/delete
                                          (diaryId=${diary.id},pageId=${page.id},elementId=${element.id})}">떼기</button>
          </div>
        </th:block>
      </figure>
    </th:block>
  <!-- 글/사진/스티커 추가 액션은 페이지 상단 편집 툴바로 옮겼다 -->
</div>

<!-- 선택했을 때만 보이는 조작점. 사진과 스티커가 같은 것을 쓴다.
     (액션 줄은 요소마다 삭제 경로가 달라 각 figure 안에 둔다) -->
<th:block th:fragment="canvasHandles">
  <!-- 상단 중앙 회전 / 우측 하단 크기 -->
  <button type="button" class="diary-rotate-handle" aria-label="회전"></button>
  <button type="button" class="diary-resize-handle" aria-label="크기 조절"></button>
</th:block>
</html>
