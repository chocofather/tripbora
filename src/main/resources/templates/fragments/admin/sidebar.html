<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<aside class="admin-sidebar" id="admin-sidebar" th:fragment="sidebar(activeMenu)">
  <a class="admin-brand" th:href="@{/admin}" aria-label="관리자 홈으로 이동">
    <span class="admin-brand-name">Tripbora</span>
    <span class="admin-brand-label">Admin</span>
  </a>
  <!-- 좁은 화면의 메뉴 서랍을 닫는다. 넓은 화면에서는 보이지 않는다 -->
  <button type="button" class="admin-sidebar-close" aria-label="메뉴 닫기"
          data-admin-menu-close>×</button>

  <nav class="admin-nav" aria-label="관리자 메뉴">
    <section class="admin-nav-group">
      <h2 class="admin-nav-group-title">대시보드</h2>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'dashboard'} ? ' is-active' : ''"
         th:href="@{/admin}">관리자 홈</a>
    </section>

    <section class="admin-nav-group">
      <h2 class="admin-nav-group-title">여행지 관리</h2>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'destinations'} ? ' is-active' : ''"
         th:href="@{/admin/destinations}">여행지</a>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'categories'} ? ' is-active' : ''"
         th:href="@{/admin/categories}">여행지 카테고리</a>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'regions'} ? ' is-active' : ''"
         th:href="@{/admin/region-categories}">지역·도시</a>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'amenities'} ? ' is-active' : ''"
         th:href="@{/admin/amenities/list}">편의시설</a>
    </section>

    <section class="admin-nav-group">
      <h2 class="admin-nav-group-title">여행정보 관리</h2>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'travel-info'} ? ' is-active' : ''"
         th:href="@{/admin/travel-info}">여행정보</a>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'festivals'} ? ' is-active' : ''"
         th:href="@{/admin/festivals}">축제·행사</a>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'info-categories'} ? ' is-active' : ''"
         th:href="@{/admin/info-categories}">정보 카테고리</a>
    </section>

    <section class="admin-nav-group">
      <h2 class="admin-nav-group-title">여행코스 관리</h2>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'courses'} ? ' is-active' : ''"
         th:href="@{/admin/courses}">검증 코스</a>
    </section>

    <section class="admin-nav-group">
      <h2 class="admin-nav-group-title">이벤트 관리</h2>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'events'} ? ' is-active' : ''"
         th:href="@{/admin/event/list}">이벤트</a>
    </section>

    <section class="admin-nav-group">
      <h2 class="admin-nav-group-title">다이어리 관리</h2>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'diary-stickers'} ? ' is-active' : ''"
         th:href="@{/admin/diary/stickers}">스티커 관리</a>
    </section>

    <section class="admin-nav-group">
      <h2 class="admin-nav-group-title">고객지원</h2>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'notices'} ? ' is-active' : ''"
         th:href="@{/admin/notices}">공지사항</a>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'faqs'} ? ' is-active' : ''"
         th:href="@{/admin/faqs}">자주 묻는 질문</a>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'inquiries'} ? ' is-active' : ''"
         th:href="@{/admin/inquiries}">1:1 문의</a>
    </section>

    <section class="admin-nav-group">
      <h2 class="admin-nav-group-title">회원 관리</h2>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'users'} ? ' is-active' : ''"
         th:href="@{/admin/users}">회원 목록</a>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'appeals'} ? ' is-active' : ''"
         th:href="@{/admin/appeals}">이의제기 관리</a>
    </section>

    <section class="admin-nav-group">
      <h2 class="admin-nav-group-title">콘텐츠 관리</h2>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'cover-library-reports'} ? ' is-active' : ''"
         th:href="@{/admin/cover-library/reports}">표지 라이브러리 신고</a>
      <a class="admin-nav-link"
         th:classappend="${activeMenu == 'contents'} ? ' is-active' : ''"
         th:href="@{/admin/contents}">조치된 콘텐츠</a>
    </section>
  </nav>
</aside>
</body>
</html>
