<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<!-- 활성 메뉴 판정은 activeMenu 코드로만 한다. 표시 문구는 언어에 따라 바뀐다. -->
<nav class="mypage-navigation"
     th:fragment="navigation(activeMenu)"
     th:attr="aria-label=#{mypage.nav.label}">
  <a class="mypage-navigation-title"
     th:classappend="${activeMenu == 'home'} ? ' is-active' : ''"
     th:attr="aria-current=${activeMenu == 'home'} ? 'page' : null"
     th:href="@{/mypage}"
     th:text="#{mypage.title}">마이페이지</a>
  <ul class="mypage-navigation-list">
    <li>
      <a class="mypage-navigation-link"
         th:classappend="${activeMenu == 'profile'} ? ' is-active' : ''"
         th:attr="aria-current=${activeMenu == 'profile'} ? 'page' : null"
         th:href="@{/mypage/profile}"
         th:text="#{mypage.nav.profile}">프로필</a>
    </li>
    <li>
      <a class="mypage-navigation-link"
         th:classappend="${activeMenu == 'posts'} ? ' is-active' : ''"
         th:attr="aria-current=${activeMenu == 'posts'} ? 'page' : null"
         th:href="@{/mypage/posts}"
         th:text="#{mypage.nav.posts}">내가 작성한 글</a>
    </li>
    <li>
      <a class="mypage-navigation-link"
         th:classappend="${activeMenu == 'comments'} ? ' is-active' : ''"
         th:attr="aria-current=${activeMenu == 'comments'} ? 'page' : null"
         th:href="@{/mypage/comments}"
         th:text="#{mypage.nav.comments}">내가 작성한 댓글</a>
    </li>
    <li>
      <a class="mypage-navigation-link"
         th:classappend="${activeMenu == 'bookmarks'} ? ' is-active' : ''"
         th:attr="aria-current=${activeMenu == 'bookmarks'} ? 'page' : null"
         th:href="@{/mypage/bookmarks}"
         th:text="#{mypage.nav.bookmarks}">북마크</a>
    </li>
    <li>
      <a class="mypage-navigation-link" th:href="@{/support/inquiries}"
         th:text="#{mypage.nav.inquiries}">내 문의내역</a>
    </li>
    <li>
      <a class="mypage-navigation-link"
         th:classappend="${activeMenu == 'account'} ? ' is-active' : ''"
         th:attr="aria-current=${activeMenu == 'account'} ? 'page' : null"
         th:href="@{/mypage/account}"
         th:text="${hasLocalPassword == false}
                  ? #{mypage.nav.account.social} : #{mypage.nav.account}">계정 및 보안</a>
    </li>
  </ul>
  <!-- 좁은 화면의 한 줄 탭에서 지금 메뉴가 보이도록 처음 위치만 맞춘다 -->
  <script src="/js/mypage-navigation.js" defer></script>
</nav>
</body>
</html>
