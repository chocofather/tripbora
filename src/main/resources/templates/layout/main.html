  <!DOCTYPE html>
  <html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLanguageTag}"
        th:fragment="layout(body, headFragment)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer-when-downgrade">
    <meta name="_csrf"
          th:if="${#authentication.principal != null and #authentication.principal != 'anonymousUser' and _csrf != null}"
          th:content="${_csrf.token}">
    <meta name="_csrf_header"
          th:if="${#authentication.principal != null and #authentication.principal != 'anonymousUser' and _csrf != null}"
          th:content="${_csrf.headerName}">
    <th:block th:replace="~{fragments/branding-head :: icons}"></th:block>
    <title th:text="${seoTitle} ?: (${pageTitle} ?: 'TripBora')">TripBora</title>
    <meta name="description" th:content="${seoDescription}" />
    <link rel="canonical" th:href="${seoSiteBaseUrl + seoCanonicalPath}" />
    <meta name="robots" th:content="${seoRobots}" />
    <meta name="naver-site-verification" content="aa175e3590c086a5d9f0e0d9c77e6029c7fa7c55" />
    <meta property="og:site_name" content="트립보라" />
    <meta property="og:title" th:content="${seoTitle} ?: (${pageTitle} ?: 'TripBora')" />
    <meta property="og:description" th:content="${seoDescription}" />
    <meta property="og:type" th:content="${seoOpenGraphType}" />
    <meta property="og:url" th:content="${seoSiteBaseUrl + seoCanonicalPath}" />
    <meta property="og:locale" th:content="${#strings.replace(currentLanguageTag, '-', '_')}" />
    <meta property="og:image" th:if="${seoImage != null and !#strings.isEmpty(seoImage)}"
          th:content="${#strings.startsWith(seoImage, 'http://') or #strings.startsWith(seoImage, 'https://')
                       ? seoImage : seoSiteBaseUrl + seoImage}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" th:content="${seoTitle} ?: (${pageTitle} ?: 'TripBora')" />
    <meta name="twitter:description" th:content="${seoDescription}" />
    <meta name="twitter:image" th:if="${seoImage != null and !#strings.isEmpty(seoImage)}"
          th:content="${#strings.startsWith(seoImage, 'http://') or #strings.startsWith(seoImage, 'https://')
                       ? seoImage : seoSiteBaseUrl + seoImage}" />
    <script th:if="${seoJsonLd != null}" type="application/ld+json"
            th:utext="${seoJsonLd}"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://tripbora.com/#organization",
        "name": "TripBora",
        "url": "https://tripbora.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://tripbora.com/android-chrome-512x512.png",
          "width": 512,
          "height": 512
        }
      }
    </script>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="/css/style.css?v=20261011-card-thumb2" />

    <!-- 각 페이지에서만 필요한 head/css -->
    <th:block th:if="${headFragment != null}" th:replace="${headFragment}"></th:block>
  </head>
  <body th:class="${bodyClass}">

  <!-- ✅ 로그인 여부를 JS에서 사용할 수 있도록 전역 변수 선언 -->
  <script th:inline="javascript">
    // principal이 null이 아니고 anonymousUser도 아닐 때만 true
    const isLoggedIn =
            /*[[${#authentication.principal != null and #authentication.principal != 'anonymousUser'}]]*/ false;
    // 관리자 조치 버튼 노출용. 실제 권한은 서버에서 다시 검증한다.
    const isAdmin =
            /*[[${#authorization.expression('hasRole(''ADMIN'')')}]]*/ false;
  </script>

  <!-- 공통 헤더 -->
  <div th:replace="~{fragments/header :: siteHeader}"></div>

  <!-- 본문 슬롯 -->
  <main>
    <div th:insert="${body}"></div>
  </main>

  <!-- 공통 푸터 -->
  <div th:replace="~{fragments/footer :: siteFooter}"></div>

  <!--
    jQuery / Swiper 는 공통으로 두지 않는다.
    쓰는 화면이 정해져 있어 그 화면의 headFragment 에서 defer 로 직접 불러온다.
    (jQuery: destination/detail, login, reset-password, register, social-signup, account/email-*)
    (Swiper: home 의 이벤트 슬라이더)
    공통으로 두면 모든 페이지가 쓰지도 않는 파일을 내려받고, jQuery 는 defer 가 없어
    첫 페인트까지 막았다. Color-Thief 는 저장소 전체에 사용처가 없어 제거했다.
  -->

  <!-- 페이지별 공통 스크립트 -->
  <script src="/js/language-menu.js" defer></script>
  <script src="/js/main.js?v=20261001-2" defer></script>
  <script src="/js/menu.js" defer></script>
  <script src="/js/admin-content-moderation.js" defer></script>

  </body>
  </html>
