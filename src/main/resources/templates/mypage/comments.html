<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/mypage-layout.css">
  <link rel="stylesheet" href="/css/mypage-comments.css">
</th:block>
<th:block th:fragment="body">
  <div class="mypage-layout">
    <nav th:replace="~{fragments/mypage/navigation :: navigation('comments')}"></nav>

    <section class="mypage-content mypage-comments-page" aria-labelledby="mypage-comments-title">
      <header class="mypage-page-header">
        <p>MY COMMENTS</p>
        <h1 id="mypage-comments-title" th:text="#{mypage.comments.title}">내가 작성한 댓글</h1>
        <span th:text="#{mypage.comments.description}">여행지, 커뮤니티와 여행 코스에 남긴 댓글을 확인할 수 있습니다.</span>
      </header>

      <!-- 필터 판정은 type 코드로만 한다. 표시 문구는 언어에 따라 바뀐다. -->
      <nav class="mypage-comment-filters" th:attr="aria-label=#{mypage.comments.filters.label}">
        <a th:href="@{/mypage/comments(type='all')}"
           th:classappend="${type == 'all'} ? ' is-active' : ''"
           th:attr="aria-current=${type == 'all'} ? 'page' : null"
           th:text="#{mypage.filter.all}">전체</a>
        <a th:href="@{/mypage/comments(type='destination')}"
           th:classappend="${type == 'destination'} ? ' is-active' : ''"
           th:attr="aria-current=${type == 'destination'} ? 'page' : null"
           th:text="#{mypage.target.destination}">여행지</a>
        <a th:href="@{/mypage/comments(type='post')}"
           th:classappend="${type == 'post'} ? ' is-active' : ''"
           th:attr="aria-current=${type == 'post'} ? 'page' : null"
           th:text="#{mypage.target.community}">커뮤니티</a>
        <a th:href="@{/mypage/comments(type='course')}"
           th:classappend="${type == 'course'} ? ' is-active' : ''"
           th:attr="aria-current=${type == 'course'} ? 'page' : null"
           th:text="#{mypage.postType.course}">여행 코스</a>
      </nav>

      <div class="mypage-comment-list">
        <article class="mypage-comment-row" th:each="comment : ${comments}">
          <div class="mypage-comment-heading">
            <div class="mypage-comment-badges">
              <span class="mypage-comment-type"
                    th:classappend="${comment.commentType == 'destination'
                        ? ' mypage-comment-type--destination'
                        : (comment.commentType == 'course'
                            ? ' mypage-comment-type--course'
                            : (comment.postType == 'TIP'
                                ? ' mypage-comment-type--tip'
                                : ' mypage-comment-type--question'))}"
                    th:text="${comment.commentType == 'destination'}
                        ? #{mypage.target.destination}
                        : (${comment.commentType == 'course'}
                            ? #{mypage.postType.course}
                            : (${comment.postType == 'TIP'}
                                ? #{mypage.postType.tip} : #{mypage.postType.question}))">여행지</span>
              <span class="mypage-comment-reply" th:if="${comment.reply}"
                    th:text="#{mypage.comments.reply}">답글</span>
            </div>
            <h2 class="mypage-comment-target">
              <a th:if="${comment.commentType == 'destination'}"
                 th:href="@{/destinations/{id}(id=${comment.targetId},commentId=${comment.commentId})}"
                 th:text="${comment.targetTitle}">원문 제목</a>
              <a th:if="${comment.commentType == 'post'}"
                 th:href="@{/post/{id}(id=${comment.targetId},commentId=${comment.commentId})}"
                 th:text="${comment.targetTitle}">원문 제목</a>
              <a th:if="${comment.commentType == 'course'}"
                 th:href="@{/courses/{id}(id=${comment.targetId},commentId=${comment.commentId})}"
                 th:text="${comment.targetTitle}">원문 제목</a>
            </h2>
          </div>

          <p class="mypage-comment-preview" th:text="${comment.contentPreview}">댓글 내용</p>

          <div class="mypage-comment-footer">
            <time th:if="${comment.createdAt != null}"
                  th:datetime="${comment.createdAt}"
                  th:text="${#strings.replace(#strings.substring(comment.createdAt, 0, 10), '-', '.')}">2026.08.12</time>
            <span th:unless="${comment.createdAt != null}"
                  th:text="#{mypage.comments.createdAtUnknown}">작성일 미상</span>

            <a th:if="${comment.commentType == 'destination'}"
               th:href="@{/destinations/{id}(id=${comment.targetId},commentId=${comment.commentId})}"
               th:text="#{mypage.comments.viewOriginal}">원문 보기</a>
            <a th:if="${comment.commentType == 'post'}"
               th:href="@{/post/{id}(id=${comment.targetId},commentId=${comment.commentId})}"
               th:text="#{mypage.comments.viewOriginal}">원문 보기</a>
            <a th:if="${comment.commentType == 'course'}"
               th:href="@{/courses/{id}(id=${comment.targetId},commentId=${comment.commentId})}"
               th:text="#{mypage.comments.viewOriginal}">원문 보기</a>
          </div>
        </article>

        <p class="mypage-comment-empty" th:if="${#lists.isEmpty(comments)}"
           th:text="#{mypage.comments.empty}">
          작성한 댓글이 없습니다.
        </p>
      </div>

      <nav class="mypage-comment-pagination" th:if="${totalPages > 0}"
           th:attr="aria-label=#{mypage.comments.pagination}">
        <a th:if="${currentPage > 1}"
           th:href="@{/mypage/comments(type=${type},page=${currentPage - 1})}"
           th:text="#{mypage.pagination.previous}">이전</a>
        <span th:unless="${currentPage > 1}" class="is-disabled" aria-disabled="true"
              th:text="#{mypage.pagination.previous}">이전</span>
        <span class="mypage-comment-page-status">
          <strong th:text="${currentPage}">1</strong>
          <span aria-hidden="true">/</span>
          <span th:text="${totalPages}">1</span>
        </span>
        <a th:if="${currentPage < totalPages}"
           th:href="@{/mypage/comments(type=${type},page=${currentPage + 1})}"
           th:text="#{mypage.pagination.next}">다음</a>
        <span th:unless="${currentPage < totalPages}" class="is-disabled" aria-disabled="true"
              th:text="#{mypage.pagination.next}">다음</span>
      </nav>
    </section>
  </div>
</th:block>
</html>
