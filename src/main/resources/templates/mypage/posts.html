<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/mypage-layout.css">
  <link rel="stylesheet" href="/css/mypage-posts.css">
</th:block>
<th:block th:fragment="body">
  <div class="mypage-layout">
    <nav th:replace="~{fragments/mypage/navigation :: navigation('posts')}"></nav>

    <section class="mypage-content mypage-posts-page" aria-labelledby="mypage-posts-title">
      <header class="mypage-page-header">
        <p>MY POSTS</p>
        <h1 id="mypage-posts-title" th:text="#{mypage.posts.title}">내가 작성한 글</h1>
        <span th:text="#{mypage.posts.description}">내가 작성한 여행 질문, 여행 팁과 여행 코스를 확인할 수 있습니다.</span>
      </header>

      <!-- 필터 판정은 type 코드로만 한다. 표시 문구는 언어에 따라 바뀐다. -->
      <nav class="mypage-post-filters" th:attr="aria-label=#{mypage.posts.filters.label}">
        <a th:href="@{/mypage/posts(type='all')}"
           th:classappend="${type == 'all'} ? ' is-active' : ''"
           th:attr="aria-current=${type == 'all'} ? 'page' : null"
           th:text="#{mypage.filter.all}">전체</a>
        <a th:href="@{/mypage/posts(type='question')}"
           th:classappend="${type == 'question'} ? ' is-active' : ''"
           th:attr="aria-current=${type == 'question'} ? 'page' : null"
           th:text="#{mypage.postType.question}">여행 질문</a>
        <a th:href="@{/mypage/posts(type='tip')}"
           th:classappend="${type == 'tip'} ? ' is-active' : ''"
           th:attr="aria-current=${type == 'tip'} ? 'page' : null"
           th:text="#{mypage.postType.tip}">여행 팁</a>
        <a th:href="@{/mypage/posts(type='course')}"
           th:classappend="${type == 'course'} ? ' is-active' : ''"
           th:attr="aria-current=${type == 'course'} ? 'page' : null"
           th:text="#{mypage.postType.course}">여행 코스</a>
      </nav>

      <div class="mypage-post-list">
        <article class="mypage-post-row"
                 th:each="item : ${posts}"
                 th:classappend="${item.boardType == 'course'} ? ' mypage-post-row--course'">
          <div class="mypage-post-main">
            <span class="mypage-post-type"
                  th:classappend="${item.boardType == 'course' ? ' mypage-post-type--course' : (item.postType == 'TIP' ? ' mypage-post-type--tip' : ' mypage-post-type--question')}"
                  th:text="${item.boardType == 'course'}
                           ? #{mypage.postType.course}
                           : (${item.postType == 'TIP'}
                               ? #{mypage.postType.tip} : #{mypage.postType.question})">여행 질문</span>
            <div class="course-card-copy" th:remove="${item.boardType != 'course'} ? 'tag' : 'none'">
            <h2 class="mypage-post-title">
              <a th:if="${item.boardType == 'post'}"
                 th:href="@{/post/{id}(id=${item.id})}"
                 th:text="${item.title}"
                 th:title="${item.title}">게시글 제목</a>
              <a th:if="${item.boardType == 'course'}"
                 th:href="@{/course/{id}(id=${item.id})}"
                 th:text="${item.title}"
                 th:title="${item.title}">여행 코스 제목</a>
            </h2>
            <div th:replace="~{course/fragments/themes :: badges(${item.themes}, true)}"></div>
            </div>
          </div>

          <div class="mypage-post-meta">
            <time th:datetime="${item.createdAt}"
                  th:text="${item.createdAt != null and #strings.length(item.createdAt) >= 10
                      ? #strings.replace(#strings.substring(item.createdAt, 2, 10), '-', '.')
                      : item.createdAt}">26.08.12</time>
            <span aria-hidden="true">·</span>
            <span><span th:text="#{mypage.posts.views}">조회</span> <strong th:text="${item.views}">0</strong></span>
          </div>
        </article>

        <p class="mypage-post-empty" th:if="${#lists.isEmpty(posts)}"
           th:text="#{mypage.posts.empty}">
          작성한 글이 없습니다.
        </p>
      </div>

      <nav class="mypage-post-pagination" th:if="${totalPages > 0}"
           th:attr="aria-label=#{mypage.posts.pagination}">
        <a th:if="${currentPage > 1}"
           th:href="@{/mypage/posts(type=${type},page=${currentPage - 1})}"
           th:text="#{mypage.pagination.previous}">이전</a>
        <span th:unless="${currentPage > 1}" class="is-disabled" aria-disabled="true"
              th:text="#{mypage.pagination.previous}">이전</span>
        <span class="mypage-post-page-status">
          <strong th:text="${currentPage}">1</strong>
          <span aria-hidden="true">/</span>
          <span th:text="${totalPages}">1</span>
        </span>
        <a th:if="${currentPage < totalPages}"
           th:href="@{/mypage/posts(type=${type},page=${currentPage + 1})}"
           th:text="#{mypage.pagination.next}">다음</a>
        <span th:unless="${currentPage < totalPages}" class="is-disabled" aria-disabled="true"
              th:text="#{mypage.pagination.next}">다음</span>
      </nav>
    </section>
  </div>
</th:block>
</html>
