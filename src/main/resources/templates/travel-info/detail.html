<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5.3.0/400.css">
  <link rel="stylesheet" crossorigin
        href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-kr@5.3.0/400.css">
  <link rel="stylesheet" href="/css/quill-content.css?v=20261003-image-layout">
  <link rel="stylesheet" href="/css/travel-info-detail.css">
  <link rel="stylesheet" href="/css/travel-info-structured.css?v=20261014-rich-text-2"
        th:if="${travelInfo.contentFormat.name() == 'STRUCTURED'}">
</th:block>
<th:block th:fragment="body">
  <article class="travel-info-detail" aria-labelledby="travel-info-detail-title">
    <header class="travel-info-detail-header">
      <p class="travel-info-detail-kicker"
         th:text="#{travelInfo.list.title.general}">여행정보</p>
      <span class="travel-info-detail-category"
            th:text="${travelInfo.categoryName}">계절여행</span>
      <div class="travel-info-detail-title-row">
        <h1 id="travel-info-detail-title" th:text="${travelInfo.title}">여행정보 제목</h1>
        <button type="button"
                class="travel-info-bookmark-button travel-info-detail-bookmark"
                th:classappend="${travelInfo.bookmarked} ? ' is-bookmarked'"
                th:data-bookmark-url="@{/bookmarks/travel-info/{id}(id=${travelInfo.id})}"
                th:data-bookmarked="${travelInfo.bookmarked}"
                th:attr="aria-pressed=${travelInfo.bookmarked},
                         aria-label=${travelInfo.bookmarked}
                           ? #{travelInfo.bookmark.remove} : #{travelInfo.bookmark.save},
                         data-label-save=#{travelInfo.bookmark.label.save},
                         data-label-saved=#{travelInfo.bookmark.label.saved},
                         data-aria-save=#{travelInfo.bookmark.save},
                         data-aria-remove=#{travelInfo.bookmark.remove},
                         data-failed-message=#{travelInfo.bookmark.failed}"
                data-travel-info-bookmark>
          <span class="travel-info-bookmark-icon" aria-hidden="true"></span>
          <span class="travel-info-bookmark-label"
                th:text="${travelInfo.bookmarked}
                         ? #{travelInfo.bookmark.label.saved}
                         : #{travelInfo.bookmark.label.save}">저장</span>
        </button>
      </div>

      <div class="travel-info-detail-type" th:if="${travelInfo.contentType.name() == 'GUIDE'}">
        <span th:text="#{travelInfo.contentType.guide}">여행가이드</span>
      </div>
      <div class="travel-info-detail-type" th:unless="${travelInfo.contentType.name() == 'GUIDE'}">
        <span th:text="${travelInfo.scope.name() == 'DOMESTIC'}
                       ? #{travelInfo.scope.domestic}
                       : #{travelInfo.scope.international}">국내</span>
        <span aria-hidden="true">·</span>
        <span th:text="${travelInfo.contentType.name() == 'GENERAL'}
                       ? #{travelInfo.contentType.general}
                       : #{travelInfo.contentType.festival}">일반</span>
      </div>

      <dl class="travel-info-detail-meta">
        <div>
          <dt th:text="#{travelInfo.detail.createdAt}">작성일</dt>
          <dd><time th:text="${#dates.format(travelInfo.createdAt, 'yyyy.MM.dd')}">2026.08.10</time></dd>
        </div>
        <div>
          <dt th:text="#{travelInfo.detail.views}">조회수</dt>
          <dd th:text="${travelInfo.views}">0</dd>
        </div>
        <div th:if="${travelInfo.updated}">
          <dt th:text="#{travelInfo.detail.updatedAt}">최종 수정</dt>
          <dd><time th:text="${#dates.format(travelInfo.updatedAt, 'yyyy.MM.dd')}">2026.08.11</time></dd>
        </div>
      </dl>
    </header>

    <section class="travel-info-detail-periods"
             th:if="${travelInfo.contentType.name() == 'FESTIVAL'
                      and !#lists.isEmpty(travelInfo.periods)}"
             aria-labelledby="travel-info-period-title">
      <h2 id="travel-info-period-title" th:text="#{travelInfo.detail.periods}">행사 기간</h2>
      <ul>
        <li th:each="period : ${travelInfo.periods}">
          <time th:text="${period.startDate}">2026.08.10</time>
          <span aria-hidden="true">~</span>
          <time th:text="${period.endDate}">2026.08.15</time>
        </li>
      </ul>
    </section>

    <!--
      STRUCTURED 글은 검사를 마친 블록으로 그린다. content 에 든 파생 HTML 은 검색/SEO 용이라 본문 디자인으로 쓰지 않는다.
      저장된 블록을 읽지 못했으면(structuredContent == null) 아래 기존 본문 자리로 파생 HTML 이 대신 나온다.
    -->
    <section class="travel-info-detail-content travel-info-structured"
             th:if="${travelInfo.contentFormat.name() == 'STRUCTURED' and travelInfo.structuredContent != null}"
             th:attr="aria-label=#{travelInfo.detail.content}">
      <div th:replace="~{fragments/travel-info/structured-content :: blocks(${travelInfo.structuredContent})}"></div>
    </section>
    <section class="travel-info-detail-content rich-text-content rich-text-image-layout"
             th:unless="${travelInfo.contentFormat.name() == 'STRUCTURED' and travelInfo.structuredContent != null}"
             th:attr="aria-label=#{travelInfo.detail.content}"
             th:utext="${travelInfo.content}"></section>

    <footer class="travel-info-detail-actions">
      <a class="travel-info-detail-back" th:href="${listUrl}"
         th:text="#{travelInfo.detail.backToList}">목록으로</a>
    </footer>
  </article>
  <!--
    STRUCTURED 본문 사진 확대 모달. 페이지에 하나만 두고, /js/structured-gallery.js 가 본문 사진을 그려진 순서대로 모아 쓴다.
    큰 사진 아래에 그 사진의 제목·설명·출처를 보여 준다. 출처는 본문에 그려진 출처 줄을 그대로 복사한다. (링크 규칙 그대로)
    이전/다음 버튼 이름은 슬라이더 버튼과 같은 문구를 쓴다.
  -->
  <dialog class="structured-gallery" id="structured-gallery" data-structured-gallery role="dialog" aria-modal="true"
          th:if="${travelInfo.contentFormat.name() == 'STRUCTURED' and travelInfo.structuredContent != null}"
          th:attr="aria-label=#{travelInfo.structured.gallery.dialog},
                   data-open-label=#{travelInfo.structured.gallery.open}">
    <button type="button" class="structured-gallery-close" data-gallery-close
            th:attr="aria-label=#{travelInfo.structured.gallery.close}"><span aria-hidden="true">&times;</span></button>
    <button type="button" class="structured-gallery-nav is-prev" data-gallery-prev
            th:attr="aria-label=#{travelInfo.structured.slider.previous}"><span aria-hidden="true">&#8249;</span></button>
    <figure class="structured-gallery-figure">
      <img class="structured-gallery-image" data-gallery-current alt="">
      <figcaption class="structured-gallery-meta" data-gallery-meta hidden>
        <strong class="structured-gallery-title" data-gallery-slot="title" hidden></strong>
        <span class="structured-gallery-description" data-gallery-slot="description" hidden></span>
        <span class="structured-gallery-credit" data-gallery-slot="credit" hidden></span>
      </figcaption>
    </figure>
    <button type="button" class="structured-gallery-nav is-next" data-gallery-next
            th:attr="aria-label=#{travelInfo.structured.slider.next}"><span aria-hidden="true">&#8250;</span></button>
  </dialog>
  <script src="/js/travel-info-bookmark.js" defer></script>
  <script src="/js/structured-slider.js?v=20261004-structured" defer
          th:if="${travelInfo.contentFormat.name() == 'STRUCTURED' and travelInfo.structuredContent != null}"></script>
  <script src="/js/structured-gallery.js?v=20261006-gallery-mobile" defer
          th:if="${travelInfo.contentFormat.name() == 'STRUCTURED' and travelInfo.structuredContent != null}"></script>
</th:block>
</html>
