<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">
<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/travel-info.css?v=20261012-festival-poster-mobile">
</th:block>
<th:block th:fragment="body">
  <section class="travel-info-page" aria-labelledby="travel-info-title">
    <header class="travel-info-heading">
      <span class="travel-info-kicker" th:text="#{travelInfo.list.kicker}">TRAVEL GUIDE</span>
      <h1 id="travel-info-title"
          th:text="${contentType != null and contentType.name() == 'FESTIVAL'}
                   ? #{travelInfo.list.title.festival}
                   : #{travelInfo.list.title.general}">여행정보</h1>
      <p th:if="${contentType == null or contentType.name() != 'FESTIVAL'}"
         th:text="#{travelInfo.list.description.general}">여행에 필요한 유용한 정보를 확인해보세요.</p>
      <p th:if="${contentType != null and contentType.name() == 'FESTIVAL'}"
         th:text="#{travelInfo.list.description.festival}">지금 열리는 축제와 행사 소식을 확인해보세요.</p>
    </header>

    <div class="travel-info-filters" th:attr="aria-label=#{travelInfo.list.filters}">
      <form class="travel-info-search" method="get" action="/travel-info"
            role="search" data-travel-info-search>
        <label class="travel-info-search-label" for="travel-info-keyword"
               th:text="#{travelInfo.list.search.label}">여행정보 검색</label>
        <div class="travel-info-search-control">
          <input type="search"
                 id="travel-info-keyword"
                 name="keyword"
                 maxlength="100"
                 autocomplete="off"
                 th:placeholder="#{travelInfo.list.search.placeholder}"
                 th:attr="aria-label=#{travelInfo.list.search.inputLabel}"
                 data-travel-info-search-input
                 th:value="${keyword}">
          <button type="button"
                  class="travel-info-search-clear"
                  th:attr="aria-label=#{travelInfo.list.search.clear},
                           hidden=${keyword == null}"
                  data-travel-info-search-clear>
            <span aria-hidden="true">×</span>
          </button>
          <button type="submit" class="travel-info-search-submit"
                  th:attr="aria-label=#{travelInfo.list.search.submit}">
            <span aria-hidden="true">🔍</span>
          </button>
        </div>

        <input type="hidden" name="scope" th:if="${scope != null}" th:value="${scope}">
        <input type="hidden" name="contentType" th:if="${contentType != null}" th:value="${contentType}">
        <input type="hidden" name="categoryId" th:each="categoryId : ${categoryIds}"
               th:value="${categoryId}">
        <input type="hidden" name="sort" th:if="${sort == 'views'}" value="views">
        <input type="hidden" name="size" th:if="${pageSize != 12}" th:value="${pageSize}">

        <noscript th:if="${keyword != null}">
          <a class="travel-info-search-noscript-clear"
             th:href="@{/travel-info(scope=${scope},contentType=${contentType},categoryId=${categoryIds},sort=${sortParam},size=${pageSize})}"
             th:text="#{travelInfo.list.search.clear}">검색어 지우기</a>
        </noscript>
      </form>

      <!-- 일반 여행정보: 국내/해외/여행가이드 전환만 둔다 ('전체'와 축제·행사는 여기 없다) -->
      <div class="travel-info-filter-group"
           th:if="${contentType == null or contentType.name() != 'FESTIVAL'}">
        <span class="travel-info-filter-label"
              th:text="#{travelInfo.list.filter.scope.general}">여행정보 구분</span>
        <!-- 국내/해외와 여행가이드는 주제 카테고리가 다르다. 유형이 바뀌는 링크에는 고른 주제를 싣지 않는다 -->
        <div class="travel-info-pills"
             th:with="isGuide=${contentType != null and contentType.name() == 'GUIDE'}">
          <a th:href="@{/travel-info(keyword=${keyword},scope='DOMESTIC',contentType='GENERAL',categoryId=${isGuide ? null : categoryIds},sort=${sortParam},size=${pageSize})}"
             class="travel-info-filter-pill"
             data-filter-name="primary" data-filter-value="DOMESTIC"
             data-filter-content-type="GENERAL"
             th:classappend="${scope != null and scope.name() == 'DOMESTIC'} ? ' is-active'"
             th:attr="aria-current=${scope != null and scope.name() == 'DOMESTIC'} ? 'true' : null"
             th:text="#{travelInfo.scope.domestic}">국내</a>
          <a th:href="@{/travel-info(keyword=${keyword},scope='INTERNATIONAL',contentType='GENERAL',categoryId=${isGuide ? null : categoryIds},sort=${sortParam},size=${pageSize})}"
             class="travel-info-filter-pill"
             data-filter-name="primary" data-filter-value="INTERNATIONAL"
             data-filter-content-type="GENERAL"
             th:classappend="${scope != null and scope.name() == 'INTERNATIONAL'} ? ' is-active'"
             th:attr="aria-current=${scope != null and scope.name() == 'INTERNATIONAL'} ? 'true' : null"
             th:text="#{travelInfo.scope.international}">해외</a>
          <!-- 여행가이드는 지역 범위가 없고, content_type = GUIDE 인 전용 주제 카테고리를 쓴다 -->
          <a th:href="@{/travel-info(keyword=${keyword},contentType='GUIDE',categoryId=${isGuide ? categoryIds : null},sort=${sortParam},size=${pageSize})}"
             class="travel-info-filter-pill"
             data-filter-name="primary" data-filter-value=""
             data-filter-content-type="GUIDE"
             th:classappend="${contentType != null and contentType.name() == 'GUIDE'} ? ' is-active'"
             th:attr="aria-current=${contentType != null and contentType.name() == 'GUIDE'} ? 'true' : null"
             th:text="#{travelInfo.contentType.guide}">여행가이드</a>
        </div>
      </div>

      <!-- 축제·행사: 지역 범위는 전체까지 그대로 둔다 -->
      <div class="travel-info-filter-group"
           th:if="${contentType != null and contentType.name() == 'FESTIVAL'}">
        <span class="travel-info-filter-label"
              th:text="#{travelInfo.list.filter.scope.festival}">지역 범위</span>
        <div class="travel-info-pills">
          <a th:href="@{/travel-info(keyword=${keyword},contentType='FESTIVAL',categoryId=${categoryIds},eventStatus=${eventStatus},sort=${sortParam},size=${pageSize})}"
             class="travel-info-filter-pill"
             data-filter-name="primary" data-filter-value=""
             data-filter-content-type="FESTIVAL"
             th:classappend="${scope == null} ? ' is-active'"
             th:attr="aria-current=${scope == null} ? 'true' : null"
             th:text="#{travelInfo.filter.all}">전체</a>
          <a th:href="@{/travel-info(keyword=${keyword},scope='DOMESTIC',contentType='FESTIVAL',categoryId=${categoryIds},eventStatus=${eventStatus},sort=${sortParam},size=${pageSize})}"
             class="travel-info-filter-pill"
             data-filter-name="primary" data-filter-value="DOMESTIC"
             data-filter-content-type="FESTIVAL"
             th:classappend="${scope != null and scope.name() == 'DOMESTIC'} ? ' is-active'"
             th:attr="aria-current=${scope != null and scope.name() == 'DOMESTIC'} ? 'true' : null"
             th:text="#{travelInfo.scope.domestic}">국내</a>
          <a th:href="@{/travel-info(keyword=${keyword},scope='INTERNATIONAL',contentType='FESTIVAL',categoryId=${categoryIds},eventStatus=${eventStatus},sort=${sortParam},size=${pageSize})}"
             class="travel-info-filter-pill"
             data-filter-name="primary" data-filter-value="INTERNATIONAL"
             data-filter-content-type="FESTIVAL"
             th:classappend="${scope != null and scope.name() == 'INTERNATIONAL'} ? ' is-active'"
             th:attr="aria-current=${scope != null and scope.name() == 'INTERNATIONAL'} ? 'true' : null"
             th:text="#{travelInfo.scope.international}">해외</a>
        </div>
      </div>

      <div th:replace="~{travel-info/fragments/category-filter :: filter}"></div>

      <!-- 축제·행사 전용: 오늘 기준 개최 상태. 기존 필터와 같은 pill 구성을 그대로 쓴다 -->
      <div class="travel-info-filter-group"
           th:if="${contentType != null and contentType.name() == 'FESTIVAL'}">
        <span class="travel-info-filter-label"
              th:text="#{travelInfo.list.filter.eventStatus}">행사 상태</span>
        <div class="travel-info-pills">
          <a th:href="@{/travel-info(keyword=${keyword},scope=${scope},contentType='FESTIVAL',categoryId=${categoryIds},sort=${sortParam},size=${pageSize})}"
             class="travel-info-filter-pill"
             data-filter-name="eventStatus" data-filter-value=""
             th:classappend="${eventStatus == null} ? ' is-active'"
             th:attr="aria-current=${eventStatus == null} ? 'true' : null"
             th:text="#{travelInfo.filter.all}">전체</a>
          <a th:href="@{/travel-info(keyword=${keyword},scope=${scope},contentType='FESTIVAL',categoryId=${categoryIds},eventStatus='ongoing',sort=${sortParam},size=${pageSize})}"
             class="travel-info-filter-pill"
             data-filter-name="eventStatus" data-filter-value="ongoing"
             th:classappend="${eventStatus == 'ongoing'} ? ' is-active'"
             th:attr="aria-current=${eventStatus == 'ongoing'} ? 'true' : null"
             th:text="#{travelInfo.eventStatus.ongoing}">진행중</a>
          <a th:href="@{/travel-info(keyword=${keyword},scope=${scope},contentType='FESTIVAL',categoryId=${categoryIds},eventStatus='upcoming',sort=${sortParam},size=${pageSize})}"
             class="travel-info-filter-pill"
             data-filter-name="eventStatus" data-filter-value="upcoming"
             th:classappend="${eventStatus == 'upcoming'} ? ' is-active'"
             th:attr="aria-current=${eventStatus == 'upcoming'} ? 'true' : null"
             th:text="#{travelInfo.eventStatus.upcoming}">진행예정</a>
          <a th:href="@{/travel-info(keyword=${keyword},scope=${scope},contentType='FESTIVAL',categoryId=${categoryIds},eventStatus='ended',sort=${sortParam},size=${pageSize})}"
             class="travel-info-filter-pill"
             data-filter-name="eventStatus" data-filter-value="ended"
             th:classappend="${eventStatus == 'ended'} ? ' is-active'"
             th:attr="aria-current=${eventStatus == 'ended'} ? 'true' : null"
             th:text="#{travelInfo.eventStatus.ended}">종료</a>
        </div>
      </div>

      <div class="travel-info-filter-actions">
        <!-- 초기화해도 보고 있던 화면(여행정보/축제·행사)은 그대로 둔다 -->
        <a class="travel-info-filter-reset"
           th:href="@{/travel-info(contentType=${contentType})}"
           th:text="#{travelInfo.list.filter.reset}"
           data-travel-info-reset>필터 초기화</a>
      </div>
    </div>

    <!-- 목록을 다시 불러오지 못했을 때 쓰는 문구를 서버가 현재 언어로 실어 준다. -->
    <p id="travel-info-async-message" class="travel-info-async-message" role="status" hidden
       th:attr="data-load-failed-message=#{travelInfo.list.loadFailed}"></p>
    <div th:replace="~{travel-info/fragments/list-results :: results}"></div>
  </section>
  <script src="/js/travel-info-list.js?v=20261002-festival-poster" defer></script>
  <script src="/js/travel-info-bookmark.js" defer></script>
</th:block>
</html>
