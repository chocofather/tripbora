<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::body}, ~{::headFragment})}">

<th:block th:fragment="headFragment">
  <link rel="stylesheet" href="/css/travel-plan.css">
  <link rel="stylesheet" href="/css/travel-plan-dashboard.css">
  <link rel="stylesheet" href="/css/travel-plan-item-types.css">
  <script src="/js/travel-plan-item-types.js" defer></script>
  <script src="/js/travel-plan-dashboard.js" defer></script>
  <!--
    완료된 여행은 읽기만 한다.
    실시간 연결도, 편집 스크립트도 싣지 않는다.
  -->
</th:block>

<th:block th:fragment="body">
  <div class="travel-plan-page">
    <div class="travel-plan-page-top">
      <div class="travel-plan-page-top-row">
        <a class="travel-plan-back-link" th:href="@{/travel-plans}">← 함께 계획하기</a>

        <!--
          내 목록에서만 치우는 것이라 낮은 위계로 둔다.
          목록 카드에는 내지 않고 이 화면까지 들어와야 보인다.
        -->
        <form method="post"
              th:action="@{|/travel-plans/${finalPlan.snapshot.travelPlanId}/final/delete|}">
          <button type="submit" class="travel-plan-final-delete"
                  onclick="return confirm('이 완료된 여행을 내 목록에서 삭제할까요?\n\n다른 참여자의 기록에는 영향을 주지 않습니다.')">
            삭제
          </button>
        </form>
      </div>
    </div>

    <!--
      같은 종이 위에 놓이지만 이제 고칠 수 없는 한 장이다.
      줄을 눌러도 아무 일이 없고, 추가 슬롯과 ⋯ 메뉴도 없다.
    -->
    <article class="travel-plan-paper travel-plan-final-paper"
             aria-labelledby="travel-plan-final-title" data-dashboard-readonly
             th:attr="data-dashboard-plan-id=${finalPlan.snapshot.travelPlanId}">

      <!--
        머리글은 작성 화면과 같은 것을 쓴다.
        다른 것은 왼쪽 선의 색과, "계획 중" 자리에 놓이는 표시뿐이다.
      -->
      <header class="travel-plan-detail-header">
        <div class="travel-plan-detail-heading"
             th:with="dayCount=${#lists.size(finalPlan.days)}">
          <p class="travel-plan-detail-status travel-plan-final-badge">완성된 여행계획</p>
          <h1 id="travel-plan-final-title">
            <span th:text="${finalPlan.snapshot.title}">제주도 여행</span>
            <span class="travel-plan-detail-length" th:if="${dayCount > 0}"
                  th:text="${dayCount > 1} ? |${dayCount - 1}박 ${dayCount}일| : '당일'">
              2박 3일
            </span>
          </h1>
          <p class="travel-plan-detail-period"
             th:text="${#temporals.format(finalPlan.snapshot.startDate, 'yyyy.MM.dd')} + ' ~ '
                      + ${#temporals.format(finalPlan.snapshot.endDate, 'yyyy.MM.dd')}">
            2026.09.13 ~ 2026.09.15
          </p>

          <!--
            완료 시점에 함께한 사람들. 그때의 이름 그대로다.
            따로 뜬 상자가 아니라 기간 아래에 이어지는 한 줄이다.
          -->
          <p class="travel-plan-final-members">
            <span class="travel-plan-final-members-label">함께한 사람</span>
            <span th:text="${#strings.listJoin(
                      finalPlan.members.![displayName], ' · ')}">민준 · 소희 · 초코</span>
          </p>
        </div>
      </header>

      <th:block th:replace="~{travelplan/fragments/dashboard :: preparation}"></th:block>

      <div class="travel-plan-days">
        <section class="travel-plan-day" th:each="day : ${finalPlan.days}"
                 th:with="dayItems=${finalPlan.itemsByDayId.get(day.id)}">
          <!-- DAY 머리글도 작성 화면과 같은 것을 쓴다 -->
          <h2 class="travel-plan-day-heading">
            <span class="travel-plan-day-number" th:text="'DAY ' + ${day.dayNumber}">DAY 1</span>
            <span class="travel-plan-day-date"
                  th:text="${#temporals.format(day.planDate, 'M월 d일')}">9월 13일</span>
          </h2>

          <ol class="travel-plan-lines">
            <!-- 완료 시점의 순서 그대로다 -->
            <li class="travel-plan-line is-item" th:each="item, status : ${dayItems}"
                th:with="alternatives=${finalPlan.alternativesByItemId.get(item.id)}">
              <span class="travel-plan-line-order"
                    th:text="${#numbers.formatInteger(status.count, 2)}">01</span>

              <div class="travel-plan-line-body">
                <th:block th:replace="~{travelplan/fragments/item-card :: view(${item}, false)}"></th:block>

                <!-- 그때 함께 적어 둔 대안이 있으면 그대로 보여 준다 -->
                <div class="travel-plan-final-alts"
                     th:unless="${#lists.isEmpty(alternatives)}">
                  <div class="travel-plan-alt" th:each="alt : ${alternatives}">
                    <span class="travel-plan-alt-mark"
                          th:text="${alt.alternativeOrder == 1 ? 'B' : 'C'}">B</span>
                    <div class="travel-plan-alt-body">
                      <p class="travel-plan-alt-view">
                        <span class="travel-plan-alt-condition"
                              th:unless="${#strings.isEmpty(alt.conditionLabel)}"
                              th:text="${alt.conditionLabel}">비가 많이 올 때</span>
                        <span class="travel-plan-alt-content"
                              th:text="${alt.content}">아쿠아플라넷 방문</span>
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </li>
          </ol>

          <p class="travel-plan-final-empty-day" th:if="${#lists.isEmpty(dayItems)}">
            이 날에는 정해 둔 일정이 없어요.
          </p>
        </section>
      </div>
      <th:block th:replace="~{travelplan/fragments/dashboard :: expenses}"></th:block>
    </article>
  </div>
</th:block>
</html>
