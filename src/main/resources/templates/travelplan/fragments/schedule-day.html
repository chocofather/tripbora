<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  DAY 전체 묶음. 처음 그릴 때와 재연결 후 다시 맞출 때가 같은 markup 을 쓴다.
  DAY 하나만 바뀌는 평소 갱신은 아래 scheduleDay 조각만 가져간다.
-->
<div class="travel-plan-days"
     th:fragment="scheduleDays(plan, days, itemsByDayId, alternativesByItemId)"
     data-travel-plan-days>
  <th:block th:each="day : ${days}">
    <th:block th:replace="~{travelplan/fragments/schedule-day :: scheduleDay(
                ${plan}, ${days}, ${day},
                ${itemsByDayId == null ? null : itemsByDayId.get(day.id)},
                ${alternativesByItemId}, false)}"></th:block>
  </th:block>
</div>

<!--
  DAY 한 구역.
  처음 그릴 때(detail.html)와 실시간 갱신(fragment endpoint)이 같은 markup 을 쓴다.
  둘을 따로 두면 나중에 화면이 서로 달라지므로 여기 하나만 고친다.
-->
<section class="travel-plan-day"
         th:fragment="scheduleDay(plan, days, day, dayItems, alternativesByItemId, dayOpen)"
         th:id="'day-' + ${day.id}"
         th:attr="data-day-id=${day.id},data-travel-plan-day-id=${day.id},
                  data-plan-date=${day.planDate}"
         th:with="itemCount=${dayItems == null ? 0 : dayItems.size()}"
         data-travel-plan-day>

  <div class="travel-plan-day-heading tp-detail-day-heading">
    <h2 class="tp-detail-day-tile" th:attr="aria-label=|DAY ${day.dayNumber}|">
      <span>DAY</span><strong th:text="${day.dayNumber}">1</strong>
    </h2>
    <div class="tp-detail-day-info">
      <span class="travel-plan-day-date"
            th:text="${#temporals.format(day.planDate, 'MM.dd(E)')}">09.13(일)</span>
      <button type="button" class="tp-detail-day-title" data-day-title-edit
              th:classappend="${#strings.isEmpty(day.title)} ? 'is-placeholder'"
              th:text="${#strings.isEmpty(day.title) ? '이날의 여행 제목을 적어 주세요' : day.title}">이날의 여행 제목을 적어 주세요</button>
      <form method="post" class="tp-detail-day-title-form" hidden data-day-title-form
            th:action="@{|/travel-plans/${plan.id}/days/${day.id}/title|}">
        <input type="text" name="title" maxlength="150" aria-label="DAY 여행 제목"
               placeholder="이날의 여행 제목을 적어 주세요" th:value="${day.title}">
        <input type="hidden" name="titleVersion" th:value="${day.titleVersion == null ? 0 : day.titleVersion}">
        <button type="submit">저장</button>
        <button type="button" data-day-title-cancel>취소</button>
      </form>
      <span class="tp-detail-day-title-status" role="status" data-day-title-status></span>
    </div>
    <button type="button" class="tp-day-collapse" aria-expanded="true"
            th:attr="aria-controls=|day-lines-${day.id}|" data-day-collapse>접기</button>
  </div>

  <ol class="travel-plan-lines" th:id="|day-lines-${day.id}|">
    <!-- 저장된 일정만 번호가 붙은 줄이 된다. 줄 자체가 편집기가 된다 -->
    <li class="travel-plan-line is-item" th:each="item, status : ${dayItems}"
        th:with="alternatives=${alternativesByItemId == null
                               ? null : alternativesByItemId.get(item.id)},
                 altCount=${alternatives == null ? 0 : alternatives.size()}"
        th:attr="data-item-id=${item.id},data-display-order=${item.displayOrder},
                 data-version=${item.version},data-alt-count=${altCount},
                 data-item-type=${item.itemType},data-item-title=${item.title},
                 data-start-time=${item.startTime == null ? '' : #temporals.format(item.startTime, 'HH:mm')}"
        data-travel-plan-item>
      <div class="tp-detail-item-shell tp-item-card" th:attr="data-type=${item.itemType}">
      <div class="tp-item-order-controls">
        <button type="button" class="tp-item-drag-handle" draggable="true"
                data-item-drag-handle
                th:attr="aria-label=|${item.title} 순서 이동|" title="드래그하여 순서 이동">
          <svg width="10" height="16" viewBox="0 0 10 16" aria-hidden="true" focusable="false">
            <g fill="currentColor"><circle cx="2" cy="3" r="1.3"/><circle cx="8" cy="3" r="1.3"/><circle cx="2" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="2" cy="13" r="1.3"/><circle cx="8" cy="13" r="1.3"/></g>
          </svg>
        </button>
        <span class="travel-plan-line-order"
              th:text="${#numbers.formatInteger(status.count, 2)}">01</span>
      </div>

      <!--
        보기와 편집기는 같은 칸을 나눠 쓴다.
        편집기를 형제 column 으로 두면 글자 오른쪽에 입력칸이 따로 생긴다.
      -->
      <div class="travel-plan-line-body">
        <th:block th:replace="~{travelplan/fragments/schedule-day :: detailRow(${item})}"></th:block>
        <!-- 상단 요약은 기존 공용 카드 모양을 유지한다. template은 상세 row에 노출되지 않는다. -->
        <template data-overview-item-view>
          <th:block th:replace="~{travelplan/fragments/item-card :: view(${item}, true)}"></th:block>
        </template>

        <form class="travel-plan-item-editor" method="post" hidden
              th:action="@{|/travel-plans/${plan.id}/days/${day.id}/items/${item.id}/update|}"
              data-travel-plan-item-form>
          <input type="hidden" name="version" th:value="${item.version}">
          <th:block th:replace="~{travelplan/fragments/item-card :: fields(${item.details}, ${item.title}, ${item.note}, ${item.startTime == null ? '' : #temporals.format(item.startTime, 'HH:mm')}, ${item.itemType})}"></th:block>
          <textarea name="content" hidden rows="1" autocomplete="off"
                    th:id="'item-content-' + ${item.id}"
                    th:text="${item.content}"></textarea>
          <div class="tp-item-editor-actions" th:with="d=${item.details}">
            <a class="tp-card-map" th:if="${d != null and (!#strings.isEmpty(d.address) or !#strings.isEmpty(d.departurePlace))}"
               th:href="@{https://www.google.com/maps/search/(api=1,query=${#strings.isEmpty(d.address) ? d.departurePlace : d.address})}"
               target="_blank" rel="noopener noreferrer" aria-label="위치 지도 열기">위치 ↗</a>
            <span>저장하면 모두에게 반영돼요.</span>
            <button type="submit">저장</button>
            <button type="button" data-item-editor-cancel>취소</button>
            <button type="submit" class="tp-editor-delete" data-item-editor-delete formnovalidate
                    th:formaction="${altCount > 0} ? @{|/travel-plans/${plan.id}/days/${day.id}/items/${item.id}/delete-group|} : @{|/travel-plans/${plan.id}/days/${day.id}/items/${item.id}/delete|}"
                    th:attr="data-delete-confirm=${altCount > 0 ? '이 일정과 대안을 함께 삭제할까요?' : '이 일정을 삭제할까요?'}">삭제</button>
          </div>
        </form>

        <!--
          대안(B/C). 카드가 아니라 A 아래에 들여쓰기된 메모처럼 붙는다.
          접힌 상태가 기본이고, "대안 N개" 를 눌러야 상세가 열린다.
        -->
        <div class="travel-plan-alt-block" data-travel-plan-alt-block>
          <button type="button" class="travel-plan-alt-toggle" th:if="${altCount > 0}"
                  aria-expanded="false" data-travel-plan-alt-toggle
                  th:text="'대안 ' + ${altCount} + '개'">대안 2개</button>

          <div class="travel-plan-alt-list" hidden data-travel-plan-alt-list>
            <div class="travel-plan-alt" th:each="alt : ${alternatives}"
                 th:attr="data-alternative-id=${alt.id},
                          data-alternative-order=${alt.alternativeOrder},
                          data-version=${alt.version}"
                 data-travel-plan-alt>
              <span class="travel-plan-alt-mark"
                    th:text="${alt.alternativeOrder == 1 ? 'B' : 'C'}">B</span>

              <div class="travel-plan-alt-body">
                <p class="travel-plan-alt-view" data-travel-plan-alt-view>
                  <span class="travel-plan-alt-condition"
                        th:unless="${#strings.isEmpty(alt.conditionLabel)}"
                        th:text="${alt.conditionLabel}">비가 많이 올 때</span>
                  <span class="travel-plan-alt-content"
                        th:text="${alt.content}">아쿠아플라넷 방문</span>
                </p>

                <!-- 조건과 내용 두 칸이라 A 와 달리 작은 저장/취소 버튼을 함께 둔다 -->
                <form class="travel-plan-alt-editor" method="post" hidden
                      th:action="@{|/travel-plans/${plan.id}/days/${day.id}/items/${item.id}/alternatives/${alt.id}/update|}"
                      data-travel-plan-alt-form>
                  <input type="hidden" name="version" th:value="${alt.version}">
                  <input type="text" name="conditionLabel" maxlength="100"
                         autocomplete="off" placeholder="조건 (선택)"
                         th:value="${alt.conditionLabel}">
                  <textarea name="content" rows="1" autocomplete="off"
                            th:text="${alt.content}"></textarea>
                  <div class="travel-plan-alt-editor-actions">
                    <button type="submit" class="travel-plan-alt-save">저장</button>
                    <button type="button" class="travel-plan-alt-cancel"
                            data-travel-plan-alt-cancel>취소</button>
                  </div>
                </form>
              </div>

              <form method="post" class="travel-plan-alt-remove-form"
                    th:action="@{|/travel-plans/${plan.id}/days/${day.id}/items/${item.id}/alternatives/${alt.id}/delete|}">
                <button type="submit" class="travel-plan-alt-remove"
                        onclick="return confirm('이 대안을 삭제할까요?')">대안 삭제</button>
              </form>
            </div>

            <!-- 새 대안. 다음 자리는 남은 개수로 정해진다 (0개면 B, 1개면 C) -->
            <div class="travel-plan-alt is-new" th:if="${altCount lt 2}"
                 data-travel-plan-alt-new>
              <span class="travel-plan-alt-mark"
                    th:text="${altCount == 0 ? 'B' : 'C'}">B</span>
              <!--
                저장된 B/C 와 같은 본문 칸을 쓴다.
                폼을 flex 자식으로 그대로 두면 입력칸의 기본 폭(cols=20)이
                그 칸의 폭이 되어 문장이 20자쯤에서 끊긴다.
              -->
              <div class="travel-plan-alt-body">
                <form class="travel-plan-alt-editor" method="post" hidden
                      th:action="@{|/travel-plans/${plan.id}/days/${day.id}/items/${item.id}/alternatives|}"
                      data-travel-plan-alt-new-form>
                  <input type="text" name="conditionLabel" maxlength="100"
                         autocomplete="off" placeholder="조건 (선택)">
                  <textarea name="content" rows="1" autocomplete="off"
                            placeholder="대안 일정 입력..."></textarea>
                  <div class="travel-plan-alt-editor-actions">
                    <button type="submit" class="travel-plan-alt-save">저장</button>
                    <button type="button" class="travel-plan-alt-cancel"
                            data-travel-plan-alt-cancel>취소</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- drag 저장 경로만 유지한다. 이동 버튼과 메뉴는 렌더링하지 않는다. -->
      <div hidden data-travel-plan-reorder-forms>
          <form method="post"
                th:action="@{|/travel-plans/${plan.id}/days/${day.id}/items/${item.id}/move-up|}">
            <input type="hidden" name="version" th:value="${item.version}">
          </form>
          <form method="post"
                th:action="@{|/travel-plans/${plan.id}/days/${day.id}/items/${item.id}/move-down|}">
            <input type="hidden" name="version" th:value="${item.version}">
          </form>
      </div>
      </div>
    </li>

    <!-- DAY 끝의 추가 슬롯 하나. 실제 일정 row 가 아니라 번호를 붙이지 않는다 -->
    <li class="travel-plan-line is-slot"
        th:attr="data-day-id=${day.id},data-slot-index=${itemCount + 1}"
        data-travel-plan-slot>
      <span class="travel-plan-line-order" aria-hidden="true"></span>

      <!-- + 는 눌리는 자리라는 표시라 글자와 따로 둔다 -->
      <div class="tp-item-add-types">
        <button type="button" class="travel-plan-slot-hint tp-item-add-type" data-add-item-type="SCHEDULE">+ 일정</button>
        <button type="button" class="tp-item-add-type" data-add-item-type="FLIGHT">+ 항공</button>
        <button type="button" class="tp-item-add-type" data-add-item-type="ACCOMMODATION">+ 숙소</button>
        <button type="button" class="tp-item-add-type" data-add-item-type="TRANSPORT">+ 이동</button>
      </div>

      <form class="travel-plan-slot-form" method="post"
            th:hidden="${!dayOpen}"
            th:action="@{|/travel-plans/${plan.id}/days/${day.id}/items|}"
            th:object="${travelPlanItemCreateForm}"
            data-travel-plan-slot-form>
        <th:block th:replace="~{travelplan/fragments/item-card :: fields(${dayOpen ? travelPlanItemCreateForm.details : null}, '', '', ${dayOpen ? travelPlanItemCreateForm.startTime : ''}, ${dayOpen ? travelPlanItemCreateForm.itemType : 'SCHEDULE'})}"></th:block>
        <!--
          DAY 마다 폼이 하나씩 있으므로 th:field 대신 name 을 직접 준다.
          (th:field 는 id 를 필드명으로 고정해 중복 id 가 생긴다)
          작성 중이던 값은 저장에 실패한 DAY 에서만 되살린다.
        -->
        <textarea name="content" hidden rows="1" autocomplete="off"
                  th:id="'content-' + ${day.id}"
                  placeholder="첫 줄에 제목, 다음 줄에 메모를 입력해 주세요"
                  aria-label="새 일정 제목과 메모"
                  th:text="${dayOpen} ? *{content} : ''"
                  th:classappend="${dayOpen and #fields.hasErrors('content')}
                                  ? 'is-invalid'"></textarea>
        <p class="travel-plan-slot-error"
           th:if="${dayOpen and #fields.hasErrors('content')}" th:errors="*{content}"></p>
        <div class="tp-item-editor-actions">
          <span>필요한 정보만 입력해 주세요.</span>
          <button type="submit">추가</button>
          <button type="button" data-item-editor-cancel>취소</button>
        </div>
      </form>
    </li>
  </ol>
</section>

<!-- 상세 일정 전용 보기. 전체 일정의 공용 카드는 변경하지 않는다. -->
<div th:fragment="detailRow(item)" class="tp-detail-item-view" data-item-view
     th:attr="data-type=${item.itemType}"
     th:with="d=${item.details},type=${item.itemType.name()},special=${type == 'FLIGHT' or type == 'ACCOMMODATION' or type == 'TRANSPORT'}">
  <div class="tp-detail-item-bar">
    <span class="tp-type-badge" th:attr="data-item-type-badge=${item.itemType}"
          th:text="${item.itemType.label}">일정</span>
    <span class="tp-detail-item-aux" th:if="${special}">
      <span class="tp-detail-item-time-label" th:text="${type == 'FLIGHT' ? '탑승시간' : (type == 'ACCOMMODATION' ? '체크인' : '출발')}">출발</span>
      <span th:text="${d == null ? '날짜 미정' : (type == 'ACCOMMODATION' ? (#strings.isEmpty(d.checkInDate) ? '날짜 미정' : d.checkInDate) : (#strings.isEmpty(d.departureDate) ? '날짜 미정' : d.departureDate))}"></span>
      <time th:text="${d != null and !#strings.isEmpty(type == 'ACCOMMODATION' ? d.checkInTime : d.departureTime) ? (type == 'ACCOMMODATION' ? d.checkInTime : d.departureTime) : (item.startTime == null ? '시간 미정' : #temporals.format(item.startTime, 'HH:mm'))}">시간 미정</time>
    </span>
    <time class="tp-detail-item-time" th:if="${!special and item.startTime != null}"
          th:text="${#temporals.format(item.startTime, 'HH:mm')}">09:00</time>
    <h3 class="tp-detail-item-title"
        th:text="${d != null and (type == 'FLIGHT' or type == 'TRANSPORT') and (!#strings.isEmpty(d.departurePlace) or !#strings.isEmpty(d.arrivalPlace)) ? #strings.defaultString(d.departurePlace, '') + ' → ' + #strings.defaultString(d.arrivalPlace, '') : (d != null and type == 'ACCOMMODATION' and !#strings.isEmpty(d.stayName) ? d.stayName : (#strings.isEmpty(item.title) ? (type == 'ACCOMMODATION' ? '숙소 이름 입력하기' : (special ? '구간 / 장소 입력하기' : '일정 입력하기')) : item.title))}">일정 제목</h3>
    <button type="button" class="tp-card-edit" data-item-edit-button aria-expanded="false" aria-label="일정 편집"><span class="tp-card-edit-label">편집</span></button>
  </div>
  <p hidden data-travel-plan-item-content th:text="${item.content}"></p>
</div>
</body>
</html>
